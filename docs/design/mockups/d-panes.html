<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spoolwarden · Workshop kit</title>
<style>
/* Layout concept: "Panes" - flat grouped-list master-detail (one screen on phone, two panes on tablet, three on desktop). */
:root{
--bg:#f2f2f5;--surface:#ffffff;--surface-2:#f6f6f8;--sunk:#e8e8ec;--text:#1b1b1f;--muted:#606067;--hair:#dadade;--line:#87878e;--knob:#ffffff;
--accent:#19763f;--on-accent:#ffffff;--accent-soft:#e2f1e7;
--ok:#176b3a;--ok-soft:#e2f1e7;--warn:#835000;--warn-soft:#fbefd4;--bad:#b3261e;--on-bad:#ffffff;--bad-soft:#fce5e2;--info:#1d56a0;--info-soft:#e3ecf8;
--inverse:#1b1b1f;--on-inverse:#f6f6f8;--scrim:rgb(20 20 24 / .42);
--fs-xs:.75rem;--fs-sm:.8125rem;--fs-md:.9375rem;--fs-lg:1.0625rem;--fs-xl:1.375rem;--fs-2xl:1.75rem;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
--r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
--e-dlg:0 18px 48px rgb(0 0 0 / .22),0 2px 6px rgb(0 0 0 / .12);
--t-fast:120ms;--t-med:220ms;
--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0e0e10;--surface:#1c1c1f;--surface-2:#242428;--sunk:#2e2e33;--text:#f1f1f3;--muted:#a3a3ab;--hair:#323237;--line:#7a7a82;--knob:#f1f1f3;
--accent:#55c98a;--on-accent:#06210f;--accent-soft:#163324;
--ok:#62d394;--ok-soft:#163324;--warn:#f0bd5a;--warn-soft:#382a0e;--bad:#ff8b80;--on-bad:#2a0705;--bad-soft:#3d1a17;--info:#8fb5f6;--info-soft:#172842;
--inverse:#f1f1f3;--on-inverse:#1b1b1f;--scrim:rgb(0 0 0 / .62);--e-dlg:0 18px 48px rgb(0 0 0 / .6),0 2px 6px rgb(0 0 0 / .4);
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0e0e10;--surface:#1c1c1f;--surface-2:#242428;--sunk:#2e2e33;--text:#f1f1f3;--muted:#a3a3ab;--hair:#323237;--line:#7a7a82;--knob:#f1f1f3;
--accent:#55c98a;--on-accent:#06210f;--accent-soft:#163324;
--ok:#62d394;--ok-soft:#163324;--warn:#f0bd5a;--warn-soft:#382a0e;--bad:#ff8b80;--on-bad:#2a0705;--bad-soft:#3d1a17;--info:#8fb5f6;--info-soft:#172842;
--inverse:#f1f1f3;--on-inverse:#1b1b1f;--scrim:rgb(0 0 0 / .62);--e-dlg:0 18px 48px rgb(0 0 0 / .6),0 2px 6px rgb(0 0 0 / .4);
color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 var(--fs-md)/1.45 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button,label[for]{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
input.sr:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:40px;height:40px;stroke-width:1.4}
.mono{font-family:var(--mono);font-size:.94em}
.muted{color:var(--muted)}
.strike{text-decoration:line-through}

/* Shell: one pane visible on phone, chosen by depth */
.main{display:contents}
.pane{display:none;min-width:0}
.app[data-depth="0"] .side,.app[data-depth="1"] .list,.app[data-depth="2"] .detail{display:block}
.phead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s2);min-height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(var(--s2),env(safe-area-inset-right)) 0 max(var(--s2),env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--hair)}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;min-width:44px;max-width:40%;padding:0 var(--s2) 0 2px;border:0;background:none;color:var(--accent);font-weight:600}
.back span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phead .sp{width:44px;flex:none}
.pt{flex:1;min-width:0;text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lockchip{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border:0;background:none;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:var(--r-pill);background:var(--sunk);font-size:var(--fs-sm);font-weight:600}
.pill .ic{width:16px;height:16px}
.lockchip[data-s="unlocked"] .pill,.lockrow[data-s="unlocked"] .tile{background:var(--ok-soft);color:var(--ok)}
.lockchip[data-s="trusted"] .pill,.lockrow[data-s="trusted"] .tile{background:var(--info-soft);color:var(--info)}
.pbody{padding:var(--s4) max(var(--s4),env(safe-area-inset-right)) calc(var(--dockh,64px) + var(--s5)) max(var(--s4),env(safe-area-inset-left))}
.h1{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.01em;line-height:1.2;padding:var(--s1) var(--s1) var(--s4)}
.h1:focus,[data-h]:focus{outline:none}
.h1:focus-visible,[data-h]:focus-visible{outline:2px solid var(--accent)}
.brand,.sfoot{display:none}

/* Grouped lists */
.grp{margin:0 0 var(--s5)}
.gh{padding:0 var(--s4) var(--s2);font-size:var(--fs-lg);font-weight:650;line-height:1.25;color:var(--text)}
.side .gh{padding-bottom:6px;font-size:var(--fs-xs);font-weight:600;line-height:1.45;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tpk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);padding:var(--s3)}
.tt{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-width:0;padding:var(--s2) var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left;transition:background var(--t-fast)}
.tt:hover{border-color:var(--text)}
.tt:active{background:var(--surface-2)}
.tt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tpv{display:block;aspect-ratio:4/3;margin-bottom:var(--s2);border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--hair)}
.tpv svg{display:block;width:100%;height:100%}
.tn{display:flex;align-items:center;justify-content:space-between;gap:var(--s1);font-weight:650}
.tchk{width:18px;height:18px;color:var(--accent)}
.tl{font-size:var(--fs-sm);color:var(--muted)}
@media (min-width:1280px){.tpk{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gf{padding:6px var(--s4) 0;font-size:var(--fs-sm);color:var(--muted)}
.lst{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.lst>*{position:relative}
.lst>:empty{display:none}
.lst>*+*::before{content:"";position:absolute;top:0;right:0;left:var(--inset,var(--s4));border-top:1px solid var(--hair);pointer-events:none}
.lst>.res::before{display:none}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:48px;padding:10px var(--s4);border:0;background:none;text-align:left;color:inherit;text-decoration:none;font:inherit}
.row.hi{--inset:58px}
button.row,a.row,label.row{cursor:pointer;transition:background var(--t-fast)}
button.row:hover,a.row:hover,label.row:hover{background:var(--surface-2)}
button.row:active,a.row:active{background:var(--sunk)}
.row:focus-visible{outline-offset:-2px;border-radius:0}
.row[aria-current]{background:var(--sunk)}
.tile{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--sunk);color:var(--text);flex:none}
.tile .ic{width:18px;height:18px}
.tile.num{font-size:var(--fs-sm);font-weight:700}
.row[aria-current] .tile{background:var(--accent);color:var(--on-accent)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt{overflow-wrap:anywhere}
.rs{font-size:var(--fs-sm);color:var(--muted);overflow-wrap:anywhere}
.rv{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px;max-width:58%;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.chev{width:16px;height:16px;color:var(--line);margin-right:-4px}
.act .rt{color:var(--accent);font-weight:600}
.dng .rt{color:var(--bad);font-weight:600}
.dng .tile{background:var(--bad-soft);color:var(--bad)}
.rb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rb .bdg,.ib .bdg{white-space:normal}
.wrap{flex-wrap:wrap}
.wrap>.rm{flex:1 1 170px}
.rbtn{display:flex;flex-wrap:wrap;gap:var(--s2);margin-left:auto}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4)}
.tick{color:var(--accent);visibility:hidden}
[aria-checked="true"]>.rv .tick{visibility:visible}
.row input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}

/* Badges, results, progress */
.bdg{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:1px 8px 1px 6px;border-radius:var(--r-pill);background:var(--sunk);color:var(--text);font-size:var(--fs-xs);font-weight:600;line-height:1.3;white-space:nowrap}
.bdg .ic{width:14px;height:14px;stroke-width:2.2}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.bdg.info{background:var(--info-soft);color:var(--info)}
.res{display:flex;flex-direction:column;gap:6px;padding:0 var(--s4) var(--s3) 58px;font-size:var(--fs-sm)}
.res.ni{padding:var(--s2) var(--s4) var(--s3)}
.note .res{padding:var(--s2) 0 0}
.res:empty,.stat:empty{display:none}
.stat{display:inline-flex;flex-direction:column;gap:4px;min-width:0;font-size:var(--fs-sm)}
.ln{display:flex;gap:6px;align-items:flex-start}
.ln .ic{width:16px;height:16px;margin-top:1px}
.r-ok{color:var(--ok)}.r-bad{color:var(--bad)}.r-warn{color:var(--warn)}.r-info,.r-note,.r-run{color:var(--muted)}
.r-ok,.r-bad{font-weight:600}
.bar{display:block;width:100%;max-width:260px;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width var(--t-med)}
.spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid var(--hair);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;min-width:44px;padding:0 var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-weight:600;font-size:var(--fs-md);text-decoration:none;white-space:nowrap;transition:background var(--t-fast)}
.btn .ic{width:18px;height:18px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.dngf{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:0 var(--s3)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{padding:0;width:44px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-md);background:var(--sunk)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 var(--s3);border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);font-size:var(--fs-sm);font-weight:600}
.seg button .ic{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);border-color:var(--line)}
.segwrap{margin:0 0 var(--s4)}
.segwrap .seg{display:flex}.segwrap .seg button{flex:1}
.fld{display:block;padding:var(--s3) var(--s4)}
.fld>label{display:block;margin-bottom:6px;font-size:var(--fs-sm);font-weight:600}
.fc{min-width:0}
.in{display:block;width:100%;min-height:44px;padding:9px var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
textarea.in{resize:vertical;min-height:84px;line-height:1.45}
.in::placeholder{color:var(--muted);opacity:1}
.in[aria-invalid="true"]{border:2px solid var(--bad);padding:8px 11px}
.in:disabled{background:var(--surface-2);color:var(--muted)}
.rm .in{margin-top:6px}
.hint{margin-top:6px;font-size:var(--fs-sm);color:var(--muted)}
.err{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:var(--fs-sm);font-weight:600;color:var(--bad)}
.err .ic{width:16px;height:16px;margin-top:1px}
.secret{display:flex;gap:var(--s2)}.secret .in{flex:1;min-width:0}
.inl{display:flex;align-items:center;gap:var(--s2)}.inl .in{width:96px}
.unit{color:var(--muted);font-size:var(--fs-sm);white-space:nowrap}
.sw{position:relative;flex:none;width:56px;height:44px;padding:0;border:0;background:none;border-radius:22px}
.sw::before{content:"";position:absolute;left:3px;top:8px;width:50px;height:28px;border-radius:14px;background:var(--line);transition:background var(--t-fast)}
.sw::after{content:"";position:absolute;left:5px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--knob);transition:transform var(--t-fast)}
.sw[aria-checked="true"]::before{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--on-accent)}
.chk{display:flex;gap:var(--s3);align-items:center;min-height:44px;margin-top:var(--s2)}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.savebar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);margin:0 0 var(--s5);padding:0 var(--s1)}

/* Blocks */
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);margin:0 0 var(--s5);border-radius:var(--r-md);background:var(--warn-soft)}
.note>.ic{color:var(--warn);margin-top:1px}
.note.info{background:var(--info-soft)}.note.info>.ic{color:var(--info)}
.note>div{flex:1;min-width:0}
.nb{margin-top:var(--s3)}
.ihead{display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s1) var(--s5)}
.ihead .tile{width:56px;height:56px;border-radius:14px}
.ihead .tile .ic{width:30px;height:30px}
.ihead h2{font-size:var(--fs-xl);font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.ihead .rs{margin-top:2px}
.ib{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.swc{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);flex:none}
.swc.none{border-style:dashed}
.slot{display:grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:6px;background:var(--sunk);font:600 var(--fs-xs)/1 var(--mono);flex:none}
.meter{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--muted)}
.pct{min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.thumb{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--hair);background:var(--sunk);color:var(--muted)}
.thumb svg{display:block;width:100%;height:100%}
.thumb .ic{width:20px;height:20px}
.thumb.lg{width:64px;height:64px;border-radius:12px}
.row.rec{align-items:flex-start;padding-top:12px;padding-bottom:12px;--inset:72px}
.row.rec .chev{align-self:center}
.photos{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);overflow-x:auto}
.pbtn{flex:none;width:120px;height:90px;padding:0;border:1px solid var(--hair);border-radius:var(--r-sm);background:none;overflow:hidden}
.pbtn svg,.phbig svg{display:block;width:100%;height:100%}
.phbig{border-radius:var(--r-md);overflow:hidden;margin-bottom:var(--s3);aspect-ratio:4/3}
.kv .ein{display:flex;align-items:center;gap:6px;width:min(58%,260px)}
.kv .ein .in{min-width:0}
.kv label.rt{flex:1;min-width:0}
.code{margin:0;padding:var(--s3) var(--s4);background:var(--sunk);font:var(--fs-xs)/1.7 var(--mono);overflow-x:auto;white-space:pre}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s2);padding:var(--s6) var(--s5);margin:0 0 var(--s5);background:var(--surface);border-radius:var(--r-md)}
.empty>.ic{color:var(--muted);margin-bottom:var(--s1)}
.et{font-weight:600;font-size:var(--fs-lg)}
.es{color:var(--muted);max-width:34ch}
.empty .btn{margin-top:var(--s3)}
.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s2);min-height:70vh;color:var(--muted)}
.prop{padding:var(--s3) var(--s4) var(--s4)}
.prop .ptl{display:flex;align-items:center;gap:6px;font-weight:600}
.prop .ptl .ic{color:var(--info)}
.diff{margin:var(--s2) 0 var(--s3)}
.diff li{display:flex;flex-direction:column;gap:2px;padding:var(--s2) 0;border-top:1px solid var(--hair)}
.diff .k{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dv{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dv .ic{width:16px;height:16px;color:var(--muted)}
.was{color:var(--muted);text-decoration:line-through}
.now{font-weight:600}
.btnrow0{display:flex;flex-wrap:wrap;gap:var(--s2)}

/* Background job, dock, toasts */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10}
.toasts{position:absolute;left:0;right:0;bottom:100%;display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:0 var(--s4) var(--s3);pointer-events:none}
.toast{display:flex;gap:var(--s2);align-items:center;max-width:100%;padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--inverse);color:var(--on-inverse);font-size:var(--fs-sm);font-weight:500;animation:fade var(--t-med) ease-out}
.toast .ic{width:18px;height:18px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.bbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s1) max(var(--s4),env(safe-area-inset-right)) calc(var(--s1) + env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left));background:var(--surface);border-top:1px solid var(--hair)}
.bbar .seg button{flex-direction:column;gap:0;min-width:58px;padding:2px 6px;font-size:var(--fs-xs);line-height:1.2}
.bb-brand{min-width:0}
.bn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bv{font-size:var(--fs-xs);color:var(--muted)}
.job{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s2) var(--s3) var(--s3) var(--s4);background:var(--surface);border-radius:var(--r-md)}
.jh{display:flex;align-items:center;gap:var(--s3)}
.jh .okj{color:var(--ok)}
.jt{font-weight:600}
.js{font-size:var(--fs-sm);color:var(--muted)}
.job .bar{max-width:none}

const pBdg=p=>p.ok?bdg('ok','sfill','Connected'):bdg('warn','shol','Offline');
const stB=st=>st==='ai'?bdg('info','sdia','Revised by AI'):st==='hand'?bdg('neu','pencil','Edited by hand'):bdg('neu','shol','As detected');
const SHP={ok:'sfill',warn:'stri',bad:'soct',neu:'shol',info:'sdia'};
const grp=(h,b,f,at)=>`<section class="grp">${h?`<h3 class="gh">${h}</h3>`:''}<div class="lst"${at||''}>${b}</div>${f?`<p class="gf">${f}</p>`:''}</section>`;
function row(o){const tag=o.tag||(o.a?'button':'div');const a=o.a?`${tag==='button'?' type="button"':''} data-a="${o.a}"${o.id!=null?` data-id="${esc(o.id)}"`:''}${o.v!=null?` data-v="${esc(o.v)}"`:''}`:'';
return `<${tag} class="row${o.icon?' hi':''}${o.cls?' '+o.cls:''}"${a}${o.at||''}>${o.lead||''}${o.icon?`<span class="tile">${ic(o.icon)}</span>`:''}<span class="rm"><span class="rt">${o.t}</span>${o.s?`<span class="rs">${o.s}</span>`:''}${o.x||''}</span>${o.val!=null&&o.val!==''?`<span class="rv">${o.val}</span>`:''}${o.chev?ic('chev','chev'):''}</${tag}>`}
const h1=t=>`<h1 class="h1" data-h tabindex="-1">${esc(t)}</h1>`;
const ihead=(lead,t,s,b)=>`<header class="ihead">${lead}<div class="rm"><h2 data-h tabindex="-1">${esc(t)}</h2>${s?`<p class="rs">${s}</p>`:''}${b?`<div class="ib">${b}</div>`:''}</div></header>`;
const tileL=i=>`<span class="tile">${ic(i)}</span>`;
const RI={ok:'sfill',bad:'soct',warn:'stri',info:'sdia',note:'sdia'};
const resHTML=s=>s?`<span class="ln r-${s.k}">${s.k==='run'?'<span class="spin" aria-hidden="true"></span>':ic(RI[s.k])}<span>${esc(s.m)}</span></span>${s.p!=null?`<span class="bar"><i style="width:${Math.round(s.p*100)}%"></i></span>`:''}`:'';
const stEl=(k,tag,c)=>`<${tag||'div'} class="${c||'res'}" data-st="${k}">${resHTML(S.st[k])}</${tag||'div'}>`;
const swRow=(t,k,on,s,a)=>`<div class="row"><span class="rm"><span class="rt" id="l-${k}">${t}</span>${s?`<span class="rs">${s}</span>`:''}</span><button type="button" class="sw" role="switch" aria-checked="${!!on}" aria-labelledby="l-${k}" data-a="${a||'sw'}" data-k="${k}"></button></div>`;
const photo=hex=>`<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><rect width="120" height="90" style="fill:var(--sunk)"/><circle cx="46" cy="45" r="37" fill="${hex}" style="stroke:var(--line)"/><circle cx="46" cy="45" r="26" style="fill:none;stroke:var(--line)"/><circle cx="46" cy="45" r="8" style="fill:var(--sunk);stroke:var(--line)"/><rect x="62" y="22" width="50" height="44" rx="3" style="fill:var(--surface);stroke:var(--line)"/><path d="M68 31h30M68 38h38M68 45h24M68 56h14" style="stroke:var(--muted);stroke-width:2.4;stroke-linecap:round"/></svg>`;
function fld(k,label,o){o=o||{};const id='f-'+k,v=o.val!=null?o.val:(S.set[k]!=null?S.set[k]:''),hid=o.hint?id+'-h':'';
let c;
if(o.opts)c=`<select class="in" id="${id}" data-k="${k}">${o.opts.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(o.area)c=`<textarea class="in${o.mono?' mono':''}" id="${id}" data-k="${k}" rows="4" spellcheck="false"${o.ph?` placeholder="${esc(o.ph)}"`:''}>${esc(v)}</textarea>`;
else c=`<input class="in${o.mono?' mono':''}" id="${id}" data-k="${k}" type="${o.secret?'password':'text'}" value="${esc(v)}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.im?` inputmode="${o.im}"`:''} autocomplete="${o.ac||'off'}"${hid?` aria-describedby="${hid}" data-hint="${hid}"`:''}>`;
if(o.secret)c=`<div class="secret">${c}<button type="button" class="btn ghost" data-a="reveal">Show</button></div>`;
return `<div class="fld"><label for="${id}">${esc(label)}</label><div class="fc">${c}${o.hint?`<p class="hint" id="${hid}">${o.hint}</p>`:''}<div class="err" id="${id}-e" hidden></div></div></div>`}

/* ---------- Chrome pieces ---------- */
let pref='system',cur='system';
try{const v=localStorage.getItem('fk-theme');if(v==='light'||v==='dark'||v==='system')pref=v}catch(e){}
const segHTML=()=>`<div class="seg" role="group" aria-label="Appearance">${[['light','sun'],['dark','moon'],['system','auto']].map(([v,i])=>`<button type="button" data-a="theme" data-v="${v}" aria-pressed="${cur===v}">${ic(i)}<span>${TL[v]}</span></button>`).join('')}</div>`;
const chipIn=()=>{const l=LK[S.lock];return `<span class="pill">${ic(l[0])}<span>${l[1]}</span></span>`};
const lockRowIn=()=>{const l=LK[S.lock];return `<span class="tile">${ic(l[0])}</span><span class="rm"><span class="rt">${l[2]}</span><span class="rs">${l[3]}</span></span>`};
const phead=(t,back,dn)=>`<div class="phead">${back?`<button type="button" class="back" data-a="back">${ic('back')}<span${dn?' data-dname':''}>${esc(back)}</span></button>`:'<span class="sp"></span>'}<p class="pt">${esc(t||'')}</p><button type="button" class="lockchip" data-a="lock" data-s="${S.lock}" aria-label="${LK[S.lock][2]}: setup code">${chipIn()}</button></div>`;
function sum(id){const c=P.filter(p=>p.ok).length,o=P.length-c;
switch(id){case'overview':return o?(o===1?'1 printer needs a look':o+' printers need a look'):'All printers answer';
case'printers':return S.emptyP||!P.length?'No printers yet':`${c} connected${o?`, ${o} offline`:''}`;
case'recent':return S.emptyI?'No additions yet':'Newest: today 14:05';
case'settings':return S.pass?'All groups saved':'Web passphrase not set';
default:return PH[id][0]}}

/* ---------- Panes ---------- */
function sideHTML(){const g={};SECS.forEach(s=>{(g[s.g]=g[s.g]||[]).push(s)});
let out='';for(const k in g)out+=grp(esc(k),g[k].map(s=>row({a:'sec',id:s.id,icon:s.i,t:s.t,s:esc(sum(s.id)),chev:1})).join(''));
return phead('',null)+`<div class="pbody"><div class="brand"><span class="tile">${ic('spool')}</span><div class="bb-brand"><p class="bn" data-dname>${esc(S.set.dname)}</p><p class="bv">Spoolwarden 0.5.2</p></div></div><h1 class="h1 ph-only" data-h tabindex="-1" data-dname>${esc(S.set.dname)}</h1>${out}<div class="sfoot"><div id="jobS"></div><div class="lst"><button type="button" class="row hi lockrow" data-a="lock" data-s="${S.lock}">${lockRowIn()}</button></div>${segHTML()}</div></div>`}
function listHTML(){const s=S.sec;const b=s==='printers'?pList():s==='recent'?iList():s==='settings'?sList():phList(s);
return phead('',S.set.dname,1)+`<div class="pbody">${h1(SEC(s).t)}${b}</div>`}
function pList(){let h='';
if(S.emptyP||!P.length)h+=`<div class="empty">${ic('printer','lg')}<p class="et">No printers yet</p><p class="es">Printers on the network appear here once they announce themselves.</p><button type="button" class="btn pri" data-a="item" data-id="add">${ic('plus')}Add a printer</button></div>`;
else h+=grp('',P.map(p=>row({a:'item',id:p.id,icon:'printer',t:esc(p.name),s:esc(p.model+' · '+p.addr),val:pBdg(p),chev:1})).join(''));
if(S.found&&!S.emptyP)h+=grp('Found on the network, not added yet',`<div class="row hi wrap"><span class="tile">${ic('wifi')}</span><span class="rm"><span class="rt">Klipper printer “mainsailos”</span><span class="rs">192.0.2.57:7125</span></span><span class="rbtn"><button type="button" class="btn" data-a="useFound">Use this printer</button><button type="button" class="btn ghost" data-a="dismiss">Dismiss</button></span></div>`);
h+=grp('Add',row({a:'item',id:'add',icon:'plus',t:'Add a printer',s:'Bambu Lab or Klipper',chev:1,cls:'act'})+row({a:'item',id:'scan',icon:'search',t:'Find Klipper printers',s:'Scan a subnet for Moonraker',chev:1})+row({a:'item',id:'pack',icon:'box',t:'Klipper add-on',s:'Spool macros and Moonraker settings',chev:1}));
h+=grp('',row({tag:'a',a:'live',at:' href="#printers"',icon:'cam',t:'Open the live printer view',s:'Camera, pause and resume. Opens the web app.',val:ic('ext','chev')}));
h+=grp('',swRow('Preview empty state','emptyP',S.emptyP,'Shows this list as it looks before any printer is added.','emptyP'));
return h}
const recRow=r=>{const st=r.id==='r1'?S.recSt:r.st;return row({a:'item',id:r.id,cls:'rec',lead:`<span class="thumb">${r.ph?photo(r.hex):ic('doc')}</span>`,t:esc(r.t),s:`${r.when.slice(11)} · ${SRC[r.src]} · ${r.sp.length>1?'spools':'spool'} ${r.sp.join(', ')} · ${r.ph?r.ph+(r.ph>1?' photos':' photo'):'no photo'}`,x:`<span class="rb">${stB(st)}${confB(r)}</span>`,chev:1})};
function iList(){let h=grp('',row({icon:'spark',t:'Label Reader',val:bdg('ok','sfill','On')}),'The newest 20 spool additions are kept with their photos (14.2 MB now).');
if(S.emptyI)h+=`<div class="empty">${ic('inbox','lg')}<p class="et">Nothing here yet</p><p class="es">No spool has been added since the history started.</p></div>`;
else{const by={};R.forEach(r=>{const k=r.when.slice(0,10);(by[k]=by[k]||[]).push(r)});for(const k in by)h+=grp(DAY[k],by[k].map(recRow).join(''))}
h+=grp('',swRow('Preview empty state','emptyI',S.emptyI,'Shows Recently added as it looks before the first spool.','emptyI'));
return h}
function sVal(k){switch(k){case'general':return esc(S.set.dname);case'storage':return locs().length+' locations';case'network':return S.set.pub?'Public address set':'No public address';case'pass':return S.pass?bdg('ok','sfill','Set'):bdg('warn','shol','Not set');case'ai':return S.key?'On':'No key';case'library':return '2026.11.2';case'voice':return S.set.voice==='piper'?'Piper':'espeak-ng';case'backups':return 'Nightly';case'appearance':return TL[cur]}return ''}
const sList=()=>SG.map(([h,ks])=>grp(h,ks.map(k=>row({a:'item',id:k,icon:SF[k][1],t:SF[k][0],val:`<span data-sv="${k}">${sVal(k)}</span>`,chev:1})).join(''))).join('')+'<p class="gf">Each group saves on its own. Changes need the setup code unless this is a trusted computer.</p>';
const phList=s=>`<div class="note info">${ic('info')}<div><p><strong>Not part of this mockup.</strong> ${esc(PH[s][1])}</p></div></div>`+grp('Sample rows',PH[s][2].map(([t,v])=>row({t:esc(t),val:esc(v)})).join(''));
function detailHTML(){const it=eff(),s=S.sec;let t='',b='';
if(s==='printers'&&it){const p=byId(it);if(it==='add'){t='Add a printer';b=addHTML()}else if(it==='scan'){t='Find Klipper printers';b=scanHTML()}else if(it==='pack'){t='Klipper add-on';b=packHTML()}else if(p){t=p.name;b=pDetail(p)}}
else if(s==='recent'&&it){const r=R.find(x=>x.id===it);if(r){t=r.t;b=rDetail(r)}}
else if(s==='settings'&&it&&FORM[it]){t=SF[it][0];b=FORM[it]()}
if(!b){const sc=SEC(s);b=`<div class="blank">${ic(sc.i,'lg')}<p class="et">${PH[s]?esc(sc.t)+' is not part of this mockup':'Nothing selected'}</p><p class="es">${PH[s]?'Printers, Recently added and Settings are fully designed.':'Pick a row in the list.'}</p></div>`}
return phead(t,SEC(s).t)+`<div class="pbody">${b}</div>`}
/* ---------- Printers detail ---------- */
function pDetail(p){const bam=p.kind==='bambu',id=p.id;let h=ihead(tileL('printer'),p.name,esc(p.model+' · '+p.addr),pBdg(p));
if(p.problem)h+=`<div class="note">${ic('warn')}<div><p>${esc(p.problem)}</p><div class="nb"><button type="button" class="btn pri" data-a="report" data-id="${id}">${ic('doc')}Collect a report</button></div>${stEl('rep-'+id)}</div></div>`;
h+=grp('',row({a:'test',id,icon:'pulse',t:'Test connection',cls:'act'})+stEl('test-'+id)+(bam?row({a:'map',id,icon:'grid',t:'Map slots',cls:'act'})+stEl('map-'+id):row({a:'detect',id,icon:'search',t:'Detect model and slots',cls:'act'})+stEl('det-'+id)));
const sl=p.slots.length?p.slots.map(x=>x[1]?`<div class="row"><span class="slot">${x[0]}</span><span class="swc" style="background:${x[2]}"></span><span class="rm"><span class="rt">${esc(x[1])}</span><span class="rs">${x[2]}</span></span><span class="rv"><span class="meter" aria-hidden="true"><i style="width:${x[3]}%"></i></span><span class="pct">${x[3]}%</span></span></div>`:`<div class="row"><span class="slot">${x[0]}</span><span class="swc none"></span><span class="rm"><span class="rt muted">Empty</span></span></div>`).join(''):`<div class="row"><span class="rm"><span class="rs">Slots show up here when the printer answers.</span></span></div>`;
h+=grp(bam?'AMS slots':'Tool slots',sl+row({a:'soon',v:'Map by loading filament',icon:'spool',t:'Map by loading filament',chev:1}));
const det=[row({t:'Model',val:esc(p.model)})];
if(bam)det.push(row({t:'Serial',val:`<span class="mono">${esc(p.serial)}</span>`}),row({t:'Certificate',val:p.cert==='Pinned'?bdg('ok','sfill','Pinned'):bdg('neu','shol','Not pinned')}),row({t:'Slot mapping',val:esc(p.mapped)}));
else det.push(row({t:'Moonraker API key',val:p.key?bdg('ok','sfill','Set'):bdg('neu','shol','Not set')}));
h+=grp('Details',det.join(''));
let c=row({a:'rename',id,icon:'pencil',t:'Rename',val:esc(p.name),chev:1})+row({a:'addr',id,icon:'globe',t:'Change address',val:esc(p.addr),chev:1});
c+=bam?row({a:'code',id,icon:'key',t:'Replace Access Code',val:'Set',chev:1}):row({a:'apikey',id,icon:'key',t:p.key?'Replace or clear API key':'Set Moonraker API key',val:p.key?'Set':'Not set',chev:1})+row({a:'lane',id,icon:'layers',t:'Lane data',val:LANE[p.lane],chev:1});
h+=grp('Connection',c);
if(bam)h+=grp('Reports',(p.problem?'':row({a:'report',id,icon:'doc',t:'Collect a report',cls:'act'})+stEl('rep-'+id))+row({a:'soon',v:'Saved reports',icon:'lines',t:'Saved reports',chev:1}));
h+=grp('',(bam?row({a:'forgetCert',id,icon:'shield',t:'Forget certificate',cls:'dng'}):'')+row({a:'forget',id,icon:'trash',t:'Forget printer',cls:'dng'}),bam?'Forget printer also deletes its Access Code.':'Forget printer also deletes its Moonraker API key.');
return h}
function addHTML(){const k=S.addType,pre=S.addPre||{};
return ihead(tileL('plus'),'Add a printer','Bambu Lab printers need the Access Code shown on the printer. Klipper printers need the Moonraker address.')
+`<div class="segwrap"><div class="seg" role="group" aria-label="Printer type">${[['bambu','Bambu Lab'],['klipper','Klipper']].map(([v,t])=>`<button type="button" aria-pressed="${k===v}" data-a="addType" data-v="${v}">${t}</button>`).join('')}</div></div><form data-add novalidate>`
+(k==='bambu'?grp('Bambu Lab printer',fld('a-addr','IP address or name',{ph:'192.0.2.40 or printer.local',val:pre.addr})+fld('a-code','Access Code',{secret:1,mono:1,hint:'On the printer: Settings &gt; Network/LAN'})+fld('a-name','Name (optional)',{val:pre.name})+fld('a-serial','Serial (optional)',{mono:1,hint:'Read from the printer when left empty.'}))
:grp('Klipper printer',fld('a-addr','Address',{ph:'192.0.2.57 or voron.example',val:pre.addr})+fld('a-port','Port',{val:pre.port||'7125',im:'numeric'})+fld('a-name','Name (optional)',{val:pre.name})+fld('a-key','Moonraker API key (optional)',{secret:1,mono:1})))
+`<div class="savebar"><button type="submit" class="btn pri">${ic('plus')}Add printer</button>${stEl('add','span','stat')}</div></form>`}
const scanRes=()=>S.scanned?grp('Result',`<div class="row hi wrap"><span class="tile">${ic('wifi')}</span><span class="rm"><span class="rt">${esc(S.scanned)}</span><span class="rs">Klipper printer “mainsailos”</span></span><span class="rbtn"><button type="button" class="btn" data-a="useFound">Use this printer</button></span></div>`):'';
const scanHTML=()=>ihead(tileL('search'),'Find Klipper printers','Looks for Moonraker on port 7125.')+grp('',fld('subnet','Subnet (optional)',{ph:'192.0.2.0/24',mono:1,hint:'Leave empty to scan the network this Hub is on.'}))+`<div class="savebar"><button type="button" class="btn pri" data-a="scan">${ic('search')}Scan</button>${stEl('scan','span','stat')}</div><div id="scanRes">${scanRes()}</div>`;
const packHTML=()=>ihead(tileL('box'),'Klipper add-on','Installs the spool macros and the Spoolwarden Moonraker settings on a Klipper printer.')+grp('Commands',`<pre class="code" id="packCode">${esc(PACK)}</pre><div class="btnrow"><button type="button" class="btn" data-a="copy">${ic('copy')}Copy</button>${stEl('copy','span','stat')}</div>`,'Run them on the Klipper printer.');

/* ---------- Intake detail ---------- */
function fldsHTML(){const e=S.edit;let h=e?`<div class="note info">${ic('pencil')}<div><p>Change what is wrong. Only changed fields are sent.</p></div></div>`:`<div class="savebar"><button type="button" class="btn" data-a="edit">${ic('pencil')}Edit by hand</button>${stEl('rec','span','stat')}</div>`;
h+=FLD.map(([g,fs])=>grp(g,fs.map(([k,l,u])=>{const v=REC[k],c=CONF[k];
if(e)return `<div class="row kv"><label class="rt" for="e-${k}">${l}</label><span class="ein"><input class="in" id="e-${k}" data-rk="${k}" value="${esc(v)}" autocomplete="off"${k==='price'?' placeholder="Not on label"':''}>${u?`<span class="unit">${u}</span>`:''}</span></div>`;
const sw=k==='col'&&/^#[0-9a-f]{6}$/i.test(v)?`<span class="swc" style="background:${v}"></span>`:'';
const shown=v===''?'<span class="muted">Empty</span>':sw+`<span>${esc(v.replace(/(\d)-(\d)/,'$1–$2'))}${u?' '+u:''}</span>`;
return row({t:l,val:shown+(c?bdg(c[0],SHP[c[0]],c[1]):'')})}).join(''),g==='Identity'?'Read confidence is high unless a field is marked.':'')).join('');
if(e)h+=`<div class="savebar"><button type="button" class="btn pri" data-a="editSave">Save changes</button><button type="button" class="btn" data-a="editCancel">Cancel</button>${stEl('rec','span','stat')}</div>`;
return h}
const propHTML=()=>S.ai!=='prop'?'':`<div class="prop"><p class="ptl">${ic('spark')}Proposed changes</p><ul class="diff">${AIP.map(([l,a,b])=>`<li><span class="k">${l}</span><span class="dv"><span class="sr">Before: </span><span class="was">${esc(a)}</span>${ic('arrow')}<span class="sr">After: </span><span class="now">${esc(b)}</span></span></li>`).join('')}</ul><div class="btnrow0"><button type="button" class="btn pri" data-a="aiAccept">Accept</button><button type="button" class="btn" data-a="aiDiscard">Discard</button></div></div>`;
const revHTML=()=>grp('Revisions',REV.slice().reverse().map(v=>`<div class="row wrap"><span class="rm"><span class="rt">Revision ${v.n} · ${esc(v.when)} · ${v.by}</span><span class="rs${v.done?' strike':''}">${esc(v.what)}</span></span><span class="rbtn">${v.done?bdg('neu','shol','Undone'):v.undo?`<button type="button" class="btn" data-a="undoRev" data-v="${v.n}">${ic('undo')}Undo revision ${v.n}</button>`:''}</span></div>`).join(''));
function rDetail(r){const one=r.id==='r1',st=one?S.recSt:r.st;
let h=ihead(`<span class="thumb lg">${r.ph?photo(r.hex):ic('doc')}</span>`,r.t,esc(r.when+' · '+SRC[r.src]),stB(st)+confB(r));
h+=grp('Photos',r.ph?`<div class="photos">${Array.from({length:r.ph},(_,i)=>`<button type="button" class="pbtn" data-a="photo" data-id="${r.id}" data-v="${i+1}" aria-label="Enlarge photo ${i+1} of ${r.ph}">${photo(r.hex)}</button>`).join('')}</div>`:row({t:'No photo',s:'This spool was added by hand.'}),r.ph?'Tap a photo to enlarge it.':'');
h+=grp('Spools',row({t:r.sp.length>1?'Spools':'Spool',val:r.sp.join(', ')})+row({t:'Source',val:SRC[r.src]}));
if(!one)return h+`<div class="note info">${ic('info')}<div><p>Field details are filled in only for the newest record in this mockup.</p></div></div>`;
h+=`<div id="flds">${fldsHTML()}</div>`;
h+=grp('Ask the AI to correct it',`<div class="fld"><label for="aiq">What is wrong?</label><div class="fc"><textarea class="in" id="aiq" rows="2" placeholder="e.g. brand is Polymaker"></textarea></div></div><div class="btnrow"><button type="button" class="btn" data-a="ask">${ic('spark')}Ask the AI</button></div>${stEl('ai','div','res ni')}<div id="aiProp">${propHTML()}</div>`);
return h+`<div id="revs">${revHTML()}</div>`}

/* ---------- Settings forms (one Save per form) ---------- */
const sb=(f,label)=>`<div class="savebar"><button type="button" class="btn pri" data-a="save" data-f="${f}">${label||'Save'}</button>${stEl('save-'+f,'span','stat')}</div>`;
const fhead=(k,s)=>ihead(tileL(SF[k][1]),SF[k][0],s);
const keyB=()=>S.key?bdg('ok','sfill','Set'):bdg('warn','shol','Not set');
const pv=(k,g,a)=>{const f=(x,y,w,h,o,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}"${r?` rx="${r}"`:''} fill="${a}"${o<1?` fill-opacity="${o}"`:''}/>`;let s=`<rect width="120" height="90" fill="${g}"/>`;

map:el=>{const p=byId(el.dataset.id),k='map-'+p.id;if(S.st[k]&&S.st[k].k==='run')return;if(!p.ok)return setSt(k,{k:'bad',m:'Map slots needs the printer to answer. Test the connection first.'});
need('map the slots of '+p.name,()=>{let n=1;const step=()=>{setSt(k,{k:'run',m:`Mapping… step ${n} of 4`,p:n/4},n>1);if(n<4){n++;setTimeout(step,800)}else setTimeout(()=>{p.mapped='Mapped';setSt(k,{k:'ok',m:'Slots: '+(p.slots.map(s=>s[0]).join(', ')||'none found')})},800)};step()})},
detect:el=>{const p=byId(el.dataset.id),k='det-'+p.id;need('detect the model and slots',()=>{setSt(k,{k:'run',m:'Asking Moonraker…'});setTimeout(()=>setSt(k,{k:'ok',m:p.slots.length?`Found ${p.slots.length} slots: ${p.slots.map(s=>s[0]).join(', ')}.`:'Found no slots.'}),1400)})},
report:el=>{const p=byId(el.dataset.id),k='rep-'+p.id;setSt(k,{k:'run',m:'Collecting a report…'});setTimeout(()=>setSt(k,{k:'ok',m:'Report saved at '+hhmm()+'. Find it in Saved reports.'}),1600)},
rename:el=>{const p=byId(el.dataset.id);fDlg('Rename printer','Name',p.name,'Rename',{empty:'Enter a name.'},v=>need('rename '+p.name,()=>{const o=p.name;p.name=v;render();toast(`Renamed ${o} to ${v}.`,'ok')}))},
addr:el=>{const p=byId(el.dataset.id),bam=p.kind==='bambu';fDlg('Change address',bam?'IP address or name':'Address',p.addr,'Save address',{empty:'Enter an address.',hint:bam?'For example 192.0.2.40 or printer.local':'For example voron.example:7125'},v=>need('change the address',()=>{p.addr=v;render();toast('Address changed to '+v+'.','ok')}))},
code:el=>{const p=byId(el.dataset.id);fDlg('Replace Access Code','New Access Code','','Replace',{secret:1,p:`For ${esc(p.name)}. The old code is deleted.`,hint:'On the printer: Settings &gt; Network/LAN',empty:'Enter the Access Code shown on the printer.'},()=>need('replace the Access Code',()=>toast('Access Code replaced for '+p.name+'.','ok')))},
apikey:el=>{const p=byId(el.dataset.id);fDlg(p.key?'Replace Moonraker API key':'Set Moonraker API key','API key','',p.key?'Replace':'Set key',{secret:1,empty:'Paste the API key from Moonraker.',extra:p.key?'<button type="button" class="btn dng" data-a="dalt" data-v="clear">Clear key</button>':'',
alt:()=>{closeDlg();need('clear the API key',()=>{p.key=false;render();toast('API key cleared for '+p.name+'.','ok')})}},()=>need('set the API key',()=>{p.key=true;render();toast('API key saved for '+p.name+'.','ok')}))},
lane:el=>{const p=byId(el.dataset.id);dlg('Lane data',`<p class="dp m">How ${esc(p.name)} reports which lane feeds the toolhead.</p><div class="lst" role="radiogroup" aria-label="Lane data">${['auto','on','off'].map(v=>row({a:'dalt',v,t:LANE[v],at:` role="radio" aria-checked="${p.lane===v}"`,val:ic('check','tick')})).join('')}</div><div class="acts"><button type="button" class="btn" data-a="dclose">Close</button></div>`,null,
v=>{closeDlg();if(v===p.lane)return;need('change lane data',()=>{p.lane=v;render();toast('Lane data: '+LANE[v]+'.','ok')})})},
forget:el=>{const p=byId(el.dataset.id);confirmDlg('Forget printer',`Forget ${esc(p.name)}? Its ${p.kind==='bambu'?'Access Code':'API key'} is deleted.`,'Forget',()=>need('forget '+p.name,()=>{P.splice(P.indexOf(p),1);S.item=null;setHash();render();focusHead();toast('Forgot '+p.name+'.','ok')}))},
forgetCert:el=>{const p=byId(el.dataset.id);confirmDlg('Forget certificate',`Forget the pinned certificate of ${esc(p.name)}? The next connection pins the certificate the printer shows then.`,'Forget certificate',()=>need('forget the certificate',()=>{p.cert='Not pinned';render();toast('Certificate forgotten for '+p.name+'.','ok')}))},
useFound:()=>{S.addType='klipper';S.addPre={addr:'192.0.2.57',port:'7125',name:'mainsailos',found:1};S.sec='printers';S.item='add';setHash();render();focusHead()},
dismiss:()=>{S.found=false;render();focusHead();toast('Dismissed mainsailos. It shows up again on the next scan.','ok')},
addType:el=>{S.addType=el.dataset.v;S.addPre=null;delete S.st.add;render('d')},
scan:()=>{const i=$('#f-subnet');fclr('f-subnet');const sn=i.value.trim()||'192.0.2.0/24';if(!/^\d{1,3}(\.\d{1,3}){3}\/\d{1,2}$/.test(sn))return ferr('f-subnet','Use the form 192.0.2.0/24, or leave it empty.');
setSt('scan',{k:'run',m:'Scanning '+sn+'…'});setTimeout(()=>{S.scanned='Found on '+sn+': 192.0.2.57:7125';setSt('scan',{k:'ok',m:'1 Klipper printer found.'});const r=$('#scanRes');if(r)r.innerHTML=scanRes()},1500)},
copy:()=>{const ok=()=>setSt('copy',{k:'ok',m:'Copied.'}),no=()=>{const r=d.createRange();r.selectNodeContents($('#packCode'));const s=getSelection();s.removeAllRanges();s.addRange(r);setSt('copy',{k:'info',m:'Selected. Press Ctrl+C to copy.'})};try{navigator.clipboard.writeText(PACK).then(ok,no)}catch(e){no()}},
photo:el=>{const r=R.find(x=>x.id===el.dataset.id);dlg(`Photo ${el.dataset.v} of ${r.ph}`,`<div class="phbig">${photo(r.hex)}</div><p class="dp m">A placeholder: photos are not part of this mockup.</p><div class="acts"><button type="button" class="btn" data-a="dclose">Close</button></div>`)},
edit:()=>{S.edit=true;delete S.st.rec;$('#flds').innerHTML=fldsHTML();const f=$('#e-brand');if(f)f.focus()},
editCancel:()=>{S.edit=false;delete S.st.rec;$('#flds').innerHTML=fldsHTML();const b=$('[data-a="edit"]');if(b)b.focus()},
editSave:()=>{const ch=[];$$('[data-rk]').forEach(i=>{const k=i.dataset.rk,v=i.value.trim();if(v!==REC[k])ch.push([k,v])});if(!ch.length)return setSt('rec',{k:'info',m:'Nothing changed.'});
need('save the record',()=>{const names=ch.map(([k])=>LBL[k]),rc=ch.map(([k,v])=>[k,REC[k],v]);ch.forEach(([k,v])=>{REC[k]=v});S.edit=false;S.recSt='hand';REV.push({n:REV.length+1,when:'just now',by:'by hand',ch:rc,what:chTxt(rc),undo:true,done:false});S.st.rec={k:'ok',m:`Saved ${ch.length} ${ch.length>1?'changes':'change'}: ${names.join(', ')}.`};render();say(S.st.rec.m);const b=$('#detail [data-a="edit"]');if(b)b.focus()})},
ask:()=>{if(S.ai==='run')return;S.ai='run';$('#aiProp').innerHTML='';setSt('ai',{k:'run',m:'Asking the AI… (up to a minute)'});setTimeout(()=>{S.ai='prop';setSt('ai',{k:'info',m:'The AI proposes 2 changes. Check them, then accept or discard.'});const p=$('#aiProp');if(p)p.innerHTML=propHTML()},2000)},
aiAccept:()=>need('accept the AI proposal',()=>{const rc=[['name',REC.name,'PolyTerra PLA Charcoal Black (Matte)'],['nozr',REC.nozr,'190-220']];rc.forEach(([k,,v])=>{REC[k]=v});S.ai=null;S.recSt='ai';REV.push({n:REV.length+1,when:'just now',by:'by AI',ch:rc,what:chTxt(rc),undo:true,done:false});S.st.ai={k:'ok',m:'Accepted: Name and Nozzle range changed.'};render();say(S.st.ai.m);const b=$('#detail [data-a="ask"]');if(b)b.focus()}),
aiDiscard:()=>{S.ai=null;$('#aiProp').innerHTML='';setSt('ai',{k:'info',m:'Proposal discarded. Nothing changed.'});$('[data-a="ask"]').focus()},
undoRev:el=>{const v=REV.find(x=>x.n===+el.dataset.v);need('undo revision '+v.n,()=>{v.done=true;v.ch.forEach(([k,o])=>{REC[k]=o});render();toast(`Revision ${v.n} undone. `+v.ch.map(([k,o])=>`${LBL[k]} is ${fv(k,o)} again`).join('; ')+'.','ok');const h=$('#revs .gh');if(h){h.tabIndex=-1;h.focus()}})},
save:el=>{const f=el.dataset.f,ks=FK[f];ks.forEach(k=>fclr('f-'+k));const val=k=>{if(k==='voice'){const c=$('input[name="voice"]:checked');return c?c.value:S.set.voice}const e=$(`#detail [data-k="${k}"]`);if(!e)return S.set[k];if(e.getAttribute('role')==='switch')return e.getAttribute('aria-checked')==='true';return e.value.trim()};
if(f==='general'&&!val('dname'))return ferr('f-dname','Enter a display name.');
if(f==='storage'){if(!val('locs'))return ferr('f-locs','Enter at least one location.');if(!/^\d{1,2}$/.test(val('boxes')))return ferr('f-boxes','Enter a whole number, for example 2.')}
if(f==='ai'){if(!/^\d{1,4}$/.test(val('reads')))return ferr('f-reads','Enter a whole number, for example 40.');if(!/^\d{1,3}$/.test(val('kept')))return ferr('f-kept','Enter a whole number, for example 20.')}
if(f==='backups'&&!/^\d{1,3}$/.test(val('keep')))return ferr('f-keep','Enter a number of days, for example 14.');
const ch=ks.filter(k=>val(k)!==S.set[k]);if(!ch.length)return setSt('save-'+f,{k:'info',m:'Nothing changed.'});
const vals={};ch.forEach(k=>{vals[k]=val(k)});
need('save '+SF[f][0],()=>{Object.assign(S.set,vals);let m='Saved.';
if(f==='ai'&&('model' in vals||'reads' in vals))m='Saved. The Hub is restarting.';
if(f==='library'){S.tokenSet=true;S.set.token='';const t=$('#f-token');if(t)t.value='';$$('[data-tst]').forEach(e=>{e.innerHTML=bdg('ok','sfill','Set')});m='Token saved.'}
S.st['save-'+f]={k:'ok',m};render(f==='storage'?'sld':'sl');setSt('save-'+f,S.st['save-'+f]);
$$('[data-sv]').forEach(e=>{e.innerHTML=sVal(e.dataset.sv)})})},
passSet:()=>{const a=$('#f-p1').value,b=$('#f-p2').value;fclr('f-p1');fclr('f-p2');let bad=0;
if(a.length<12){ferr('f-p1','Use at least 12 characters.');bad=1}
if(a!==b){ferr('f-p2','The two passphrases do not match.',bad);bad=1}
if(bad)return;need('set the web passphrase',()=>{S.pass=true;$('#f-p1').value='';$('#f-p2').value='';$$('[data-pst]').forEach(e=>{e.innerHTML=bdg('ok','sfill','Set')});render('sl');setSt('save-pass',{k:'ok',m:'Passphrase set.'})})},
keyCheck:()=>{setSt('key',{k:'run',m:'Checking the key…'});setTimeout(()=>setSt('key',S.key?{k:'ok',m:'The key works.'}:{k:'warn',m:'No key is set. Add one with Replace.'}),1200)},
keyRep:el=>{const b=$('#keyRep'),open=b.hidden;b.hidden=!open;el.setAttribute('aria-expanded',String(open));if(open)$('#f-newkey').focus()},
keySave:()=>{const v=$('#f-newkey').value.trim();fclr('f-newkey');if(!/^sk-ant-\S{8,}$/.test(v))return ferr('f-newkey','This does not look like an Anthropic API key. It starts with sk-ant-.');
need('replace the API key',()=>{S.key=true;$('#f-newkey').value='';$('#keyRep').hidden=true;$('[data-a="keyRep"]').setAttribute('aria-expanded','false');$$('[data-kst]').forEach(e=>{e.innerHTML=keyB()});$$('[data-sv="ai"]').forEach(e=>{e.innerHTML=sVal('ai')});setSt('key',{k:'ok',m:'Key replaced.'})})},
keyDel:()=>confirmDlg('Remove API key','Remove the Anthropic API key? The Label Reader stops until a key is added again.','Remove key',()=>need('remove the API key',()=>{S.key=false;$$('[data-kst]').forEach(e=>{e.innerHTML=keyB()});$$('[data-sv="ai"]').forEach(e=>{e.innerHTML=sVal('ai')});setSt('key',{k:'warn',m:'Key removed. The Label Reader is off until a key is added.'})})),
backup:()=>{if(S.job&&S.job.k==='run')return toast('A backup is already running.','info');need('back up now',startJob)},
jobLog:()=>{S.jobOpen=!S.jobOpen;paintJob()},
jobClear:()=>{S.job=null;S.jobOpen=false;paintJob();focusHead()},
rzCheck:()=>{const f=$('#rzip').files[0];setSt('rz',{k:'run',m:'Uploading and checking…'});setTimeout(()=>{setSt('rz',{k:'ok',m:`${f?f.name:'The zip'} is a Spoolwarden backup. Restoring it replaces the settings, setup secrets, spools and Recently added records of this Hub.`});$('#rzType').disabled=false;$('#rzType').focus()},1200)},
rzCancel:()=>{const i=$('#rzip');i.value='';$('#rzName').textContent='No zip chosen';$('#rzCheck').disabled=true;const t=$('#rzType');t.value='';t.disabled=true;$('#rzGo').disabled=true;setSt('rz',null);say('Restore cancelled.')},
restore:()=>need('restore the backup',()=>toast('Restore is not part of this mockup.','info')),
libUp:()=>{setSt('lib',{k:'run',m:'Checking for a newer Catalog…'});setTimeout(()=>setSt('lib',{k:'ok',m:'Already the newest: 2026.11.2.'}),1400)},
libBack:()=>dlg('Go back to the version before',`<p class="dp">Spoolwarden uses the Catalog version it had before 2026.11.2. Update now brings 2026.11.2 back.</p>`+acts('Go back'),()=>{closeDlg();need('go back to the version before',()=>setSt('lib',{k:'ok',m:'Went back to the version before. Update now brings 2026.11.2 back.'}))}),
entryAdd:()=>{const t=$('#f-entry');fclr('f-entry');const v=t.value.trim();if(!v)return ferr('f-entry','Paste an entry first.');let o;try{o=JSON.parse(v)}catch(e){return ferr('f-entry','That is not valid JSON. Check the quotes and brackets.')}
if(!o||typeof o!=='object'||Array.isArray(o))return ferr('f-entry','Use one object in curly brackets.');
need('add a Catalog entry',()=>{S.libAdds++;t.value='';const s=$('#libS');if(s)s.textContent=`${S.libAdds} local additions. Last check 2026-11-12 03:10: ok.`;setSt('entry',{k:'ok',m:`Entry added. ${S.libAdds} local additions now.`})})}};

function addSubmit(){const bam=S.addType==='bambu',v=k=>{const e=d.getElementById('f-'+k);return e?e.value.trim():''};['a-addr','a-code','a-port'].forEach(k=>fclr('f-'+k));
const addr=v('a-addr'),code=v('a-code'),port=v('a-port'),name=v('a-name'),serial=v('a-serial'),key=v('a-key'),pre=S.addPre;let bad=0;
if(!addr){ferr('f-a-addr',bam?'Enter the printer’s IP address or name.':'Enter the printer’s address.');bad=1}
if(bam&&!code){ferr('f-a-code','Enter the Access Code shown on the printer.',bad);bad=1}
if(!bam&&!/^\d{2,5}$/.test(port)){ferr('f-a-port','Enter a port number, for example 7125.',bad);bad=1}
if(bad)return;
need('add the printer',()=>{setSt('add',{k:'run',m:'Connecting to '+addr+'…'});setTimeout(()=>{const id='n'+Date.now();
const p=bam?{id,name:name||addr,kind:'bambu',model:'Bambu Lab printer',addr,serial:serial||'Read from the printer',ok:true,cert:'Pinned',mapped:'Not yet',slots:[]}:{id,name:name||addr,kind:'klipper',model:'Klipper',addr:addr+':'+port,ok:true,key:!!key,lane:'auto',slots:[]};
P.push(p);if(pre&&pre.found)S.found=false;S.addPre=null;S.addType='bambu';delete S.st.add;S.emptyP=false;S.item=id;setHash();render();focusHead();toast('Added '+p.name+'.','ok')},1200)})}

/* ---------- Events ---------- */
d.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(el.tagName==='A')e.preventDefault();const f=A[el.dataset.a];if(f)f(el,e)});
d.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='dlgF'){if(D._ok)D._ok()}else if(e.target.matches('[data-add]'))addSubmit()});
d.addEventListener('input',e=>{const t=e.target;
if(t.id==='code'){const v=t.value.replace(/\D/g,'').slice(0,8);t.value=v.length>4?v.slice(0,4)+'-'+v.slice(4):v}
if(t.id==='rzType')$('#rzGo').disabled=t.value.trim().toLowerCase()!=='restore';
if(t.id==='f-locs'){const l=t.value.split(',').map(s=>s.trim()).filter(Boolean);['pla','over'].forEach(k=>{const s=d.getElementById('f-'+k);if(!s)return;const c=s.value;s.innerHTML=l.map(x=>`<option${x===c?' selected':''}>${esc(x)}</option>`).join('')})}
if(t.getAttribute&&t.getAttribute('aria-invalid')==='true')fclr(t.id);
const f=t.closest&&t.closest('[data-form]');if(f&&f.dataset.form!=='pass')setSt('save-'+f.dataset.form,{k:'note',m:'Not saved yet.'},1)});
d.addEventListener('change',e=>{if(e.target.id==='rzip'){const f=e.target.files[0];$('#rzName').textContent=f?f.name:'No zip chosen';$('#rzCheck').disabled=!f;setSt('rz',null)}});
d.addEventListener('keydown',e=>{if(D.hidden)return;if(e.key==='Escape'){e.preventDefault();closeDlg()}else if(e.key==='Tab'){const f=focusables(D);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&d.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&d.activeElement===z){e.preventDefault();a.focus()}}});
$('#scrim').addEventListener('click',closeDlg);
const onLay=()=>render();
[mqT,mqD].forEach(m=>{if(m.addEventListener)m.addEventListener('change',onLay);else m.addListener(onLay)});
addEventListener('hashchange',fromHash);
if(window.ResizeObserver)new ResizeObserver(()=>root.style.setProperty('--dockh',dock.offsetHeight+'px')).observe(dock);
$('#bbSeg').innerHTML=segHTML();
fromHash();
})();
</script>
