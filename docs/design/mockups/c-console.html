<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Printers · Workshop hub</title>
<style>
/* Layout concept: "Console" - dense technical console; icon rail + hairline tables on desktop/tablet, bottom bar + stacked cards on phone. */
:root{
color-scheme:light;
--bg:#f3f5f6;--surface:#ffffff;--surface-2:#eef1f3;--surface-3:#e1e6e9;
--text:#10161b;--muted:#545e68;--border:#d6dce1;--border-strong:#7d8892;
--accent:#00788a;--accent-hover:#00636f;--accent-2:#0b7d6d;--on-accent:#ffffff;--accent-soft:#e0f2f4;--accent-text:#006474;
--ok:#1a7a3c;--ok-soft:#e3f3e8;--warn:#8a5700;--warn-soft:#fbf0d5;--bad:#b42519;--bad-soft:#fbe7e5;--on-bad:#ffffff;--info:#1d5fae;--info-soft:#e4eefa;
--focus:#0b7fa6;--scrim:rgb(12 18 22 / .5);--code:#f6f8f9;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
--fs-xs:11px;--fs-s:12px;--fs-m:13px;--fs-b:14px;--fs-l:16px;--fs-xl:20px;--fs-2xl:24px;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
--r-s:4px;--r:6px;--r-l:10px;
--e0:none;--e2:0 12px 32px rgb(16 22 27 / .16),0 0 0 1px var(--border);
--t-fast:120ms;--t:200ms;--t-slow:320ms;
--ctl:40px;--rail:76px;--top:52px;--tab:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
color-scheme:dark;
--bg:#0b0f12;--surface:#11171c;--surface-2:#172027;--surface-3:#212c34;
--text:#e3e9ed;--muted:#98a4ae;--border:#253039;--border-strong:#66737e;
--accent:#3cccd8;--accent-hover:#6bdbe4;--accent-2:#3bc6a2;--on-accent:#04262b;--accent-soft:#0e2a30;--accent-text:#5fd6e0;
--ok:#5ccf88;--ok-soft:#0f2619;--warn:#efb946;--warn-soft:#2a210e;--bad:#ff7d73;--bad-soft:#311816;--on-bad:#2b0704;--info:#80b4ff;--info-soft:#122039;
--focus:#6bdbe4;--scrim:rgb(0 0 0 / .62);--code:#0d1317;
--e2:0 14px 36px rgb(0 0 0 / .55),0 0 0 1px var(--border-strong);
}}
:root[data-theme="dark"]{
color-scheme:dark;
--bg:#0b0f12;--surface:#11171c;--surface-2:#172027;--surface-3:#212c34;
--text:#e3e9ed;--muted:#98a4ae;--border:#253039;--border-strong:#66737e;
--accent:#3cccd8;--accent-hover:#6bdbe4;--accent-2:#3bc6a2;--on-accent:#04262b;--accent-soft:#0e2a30;--accent-text:#5fd6e0;
--ok:#5ccf88;--ok-soft:#0f2619;--warn:#efb946;--warn-soft:#2a210e;--bad:#ff7d73;--bad-soft:#311816;--on-bad:#2b0704;--info:#80b4ff;--info-soft:#122039;
--focus:#6bdbe4;--scrim:rgb(0 0 0 / .62);--code:#0d1317;
--e2:0 14px 36px rgb(0 0 0 / .55),0 0 0 1px var(--border-strong);
}
@media (max-width:600px){:root{--ctl:44px}}
@media (prefers-reduced-motion:reduce){:root{--t-fast:0ms;--t:0ms;--t-slow:0ms}}

/* base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 72px)}
body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font:var(--fs-b)/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,ul,ol,pre,fieldset{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--accent-text);text-underline-offset:2px}
b,strong{font-weight:600}
.mono{font-family:var(--mono);font-size:.94em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:16px;height:16px}
.skip{position:absolute;left:8px;top:-80px;z-index:99;padding:10px 14px;background:var(--accent);color:var(--on-accent);border-radius:var(--r)}
.skip:focus{top:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* chrome */
.app{display:grid;grid-template-columns:calc(var(--rail) + env(safe-area-inset-left)) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "rail main";min-height:100vh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:var(--s2);min-height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(var(--s4),env(safe-area-inset-right)) 0 env(safe-area-inset-left);background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;min-width:0;flex:1}
.mark{display:grid;place-items:center;width:var(--rail);flex:none}
.mark svg{width:28px;height:28px}
.bt{display:flex;align-items:baseline;gap:var(--s2);min-width:0;white-space:nowrap}
.bt b{font-size:var(--fs-l);font-weight:650;letter-spacing:-.01em}
.srv{display:flex;align-items:baseline;gap:var(--s2);color:var(--muted);font-size:var(--fs-m);min-width:0}
.ver{font-size:var(--fs-xs);padding:1px 6px;border:1px solid var(--border);border-radius:var(--r-s)}
.chipb{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:var(--ctl);padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:var(--fs-m);font-weight:600;cursor:pointer;white-space:nowrap}
.chipb::after{content:"";position:absolute;inset:calc((var(--ctl) - 44px) / 2)}
.chipb:hover{background:var(--surface-2)}
.chipb .h{font-weight:400;color:var(--muted);padding-left:8px;margin-left:2px;border-left:1px solid var(--border)}
.lock[data-s="unlocked"]{color:var(--ok);border-color:var(--ok)}
.lock[data-s="trusted"]{color:var(--accent-text);border-color:var(--accent)}
.jobind[data-s="done"]{color:var(--ok)}
.jobind[data-s="failed"]{color:var(--bad)}
.top .themeBtn{display:none}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);min-width:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg label{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:calc(var(--ctl) - 6px);min-width:44px;padding:0 10px;border-radius:var(--r-s);color:var(--muted);font-size:var(--fs-m);cursor:pointer;white-space:nowrap}
.seg label::after{content:"";position:absolute;inset:-5px 0}
.seg label:hover{color:var(--text);background:var(--surface-2)}
.seg input:checked+label{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.seg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:1px}
.seg.wide{display:flex}.seg.wide label{flex:1}

.rail{grid-area:rail;position:sticky;top:calc(var(--top) + env(safe-area-inset-top));align-self:start;height:calc(100vh - var(--top) - env(safe-area-inset-top));overflow-y:auto;padding:var(--s2) 0 var(--s4) env(safe-area-inset-left);background:var(--surface);border-right:1px solid var(--border)}
.rail ul{display:grid;gap:2px}
.rail .sep{height:1px;background:var(--border);margin:6px 16px}
.nav{position:relative;display:grid;justify-items:center;align-content:center;gap:4px;min-height:56px;margin:0 6px;padding:4px 2px;border:0;border-radius:var(--r);background:none;color:var(--muted);font-size:var(--fs-xs);font-weight:550;line-height:1.1;text-align:center;text-decoration:none;cursor:pointer}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav[aria-current="page"],.nav.cur{color:var(--accent-text);background:var(--accent-soft);font-weight:700}
.nav[aria-current="page"]::before,.nav.cur::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--accent),var(--accent-2))}
.tabbar{display:none}
main{grid-area:main;min-width:0;padding:var(--s5) max(var(--s5),env(safe-area-inset-right)) var(--s7) var(--s5);outline:none}
.view{max-width:1400px}

/* view header */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s3) var(--s4);padding-bottom:var(--s4);margin-bottom:var(--s4);border-bottom:1px solid var(--border)}
.vh>div:first-child{min-width:0}
.crumb{font-family:var(--mono);font-size:var(--fs-s);color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}
.vh h1{font-size:var(--fs-xl);font-weight:650;letter-spacing:-.01em;line-height:1.25;outline:none;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:6px;color:var(--muted);font-size:var(--fs-m)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.vh .acts{margin-left:auto}
.nowrap{flex-wrap:nowrap}

/* controls */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ctl);padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:var(--fs-m);font-weight:550;line-height:1.2;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.btn::after{content:"";position:absolute;inset:calc((var(--ctl) - 44px) / 2)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:var(--on-bad)}
.btn.icon{width:var(--ctl);padding:0}
.btn.left{justify-content:flex-start}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.spin{display:inline-block;width:14px;height:14px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
.lbl{display:block;margin-bottom:4px;font-size:var(--fs-m);font-weight:600}
.in{display:block;width:100%;min-height:44px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface);color:var(--text);font-size:var(--fs-b)}
.in.mono{font-size:var(--fs-m)}
textarea.in{min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
.in::placeholder{color:var(--muted);opacity:1}
.in:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.in[aria-invalid="true"]{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.in.num{max-width:120px}
input[type="file"].in{padding:8px 10px;font-size:var(--fs-m)}
.hint{margin-top:4px;font-size:var(--fs-s);color:var(--muted)}
.err{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-s);font-weight:600;color:var(--bad)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:var(--fs-m);cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.tgl{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:var(--fs-m)}
.tg{appearance:none;position:relative;flex:none;width:40px;height:24px;margin:0;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface-3);cursor:pointer;transition:background-color var(--t-fast)}
.tg::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform var(--t-fast)}
.tg:checked{background:var(--accent);border-color:var(--accent)}
.tg:checked::before{transform:translateX(16px);background:var(--on-accent)}
.tw-x::after{content:"Off";font-family:var(--mono);font-size:var(--fs-s);color:var(--muted)}
.tg:checked+.tw-x::after{content:"On";color:var(--accent-text)}

/* status: shape + word */
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-m);font-weight:600;line-height:1.3;white-space:nowrap}
.st::before{content:"";flex:none;width:8px;height:8px;background:currentColor}
.st.ok{color:var(--ok)}.st.ok::before{border-radius:50%}
.st.bad{color:var(--bad)}.st.bad::before{width:10px;height:10px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.st.down{color:var(--bad)}.st.down::before{background:none;border:1.5px solid currentColor;border-radius:50%}
.st.warn{color:var(--warn)}.st.warn::before{width:10px;height:9px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.st.info{color:var(--info)}.st.info::before{width:7px;height:7px;transform:rotate(45deg)}
.st.ai{color:var(--accent-text)}.st.ai::before{width:7px;height:7px;transform:rotate(45deg)}
.st.off{color:var(--muted)}.st.off::before{background:none;border:1.5px solid currentColor;border-radius:50%}
.st.n{color:var(--text)}.st.n::before{background:none;border:1.5px solid var(--muted);border-radius:50%}
.st.hand{color:var(--info)}.st.hand::before{width:7px;height:7px;transform:rotate(45deg)}
.st.run{color:var(--accent-text)}.st.run::before{width:10px;height:10px;background:linear-gradient(90deg,currentColor 50%,transparent 50%);border:1.5px solid currentColor;border-radius:50%}
.st.sm{font-size:var(--fs-s)}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface-2);color:var(--muted);font-size:var(--fs-s);font-weight:500;white-space:nowrap}
.line{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2);font-size:var(--fs-m)}
.line.ok{background:var(--ok-soft);border-color:transparent}
.line.bad{background:var(--bad-soft);border-color:transparent}
.line.warn{background:var(--warn-soft);border-color:transparent}
.line.info,.line.run{background:var(--info-soft);border-color:transparent}
.line .lt{flex:1;min-width:0;overflow-wrap:anywhere}
.line .lt .prog{margin-top:6px;max-width:320px}
.line>.st::before{width:9px;height:9px}
.lines{display:grid;gap:6px}
.fb{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-m);min-height:20px}
.fb:empty{display:none}
.prog{display:block;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width var(--t)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s3);min-height:48px;padding:10px var(--s4);border-bottom:1px solid var(--border)}
.panel-h h2{font-size:var(--fs-l);font-weight:650}
.panel-h .acts{margin-left:auto}
.panel-h>.i{color:var(--accent-text)}
.desc{margin-top:2px;font-size:var(--fs-s);color:var(--muted);font-weight:400}
.panel-b{padding:var(--s4)}
.pf{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:var(--s2) var(--s3);padding:10px var(--s4);border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.pf .fb{margin-right:auto}
.sh{margin:0 0 var(--s2);font-size:var(--fs-s);font-weight:650;color:var(--muted)}
.stack{display:grid;gap:var(--s4)}
.empty{display:grid;justify-items:center;gap:var(--s2);padding:var(--s7) var(--s5);text-align:center;border-style:dashed}
.empty .ei{display:grid;place-items:center;width:56px;height:56px;margin-bottom:var(--s2);border-radius:50%;background:var(--accent-soft);color:var(--accent-text)}
.empty .ei .i{width:28px;height:28px}
.empty h2{font-size:var(--fs-l);font-weight:650}
.empty p{max-width:440px;color:var(--muted)}
.empty .acts{justify-content:center;margin-top:var(--s2)}
.foot{display:flex;justify-content:flex-end;margin-top:var(--s4);padding-top:var(--s3);border-top:1px dashed var(--border)}
.call{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);font-size:var(--fs-m)}
.call .i{color:var(--warn);margin-top:-1px}
.code{border:1px solid var(--border);border-radius:var(--r);background:var(--code)}
.code pre{padding:10px 12px;font:var(--fs-s)/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.code .cb{display:flex;align-items:center;gap:var(--s2);padding:2px 2px 2px 12px;border-top:1px solid var(--border)}
.code .cb .mono{margin-right:auto;color:var(--muted);font-size:var(--fs-xs)}

/* tables */
.tw{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-m)}
.tbl th{height:44px;padding:0 12px;text-align:left;font-size:var(--fs-s);font-weight:650;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.sort{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.sort .i{width:14px;height:14px;opacity:.75}
th[aria-sort] .sort{color:var(--text)}
.tbl td{padding:10px 12px;vertical-align:middle}
.sub{display:block;margin-top:2px;font-size:var(--fs-s);color:var(--muted);font-weight:400}
.c-name b{font-size:var(--fs-b)}
.pt tbody{border-bottom:1px solid var(--border)}
.pt tbody:last-child{border-bottom:0}
.pt tr.row>td{height:60px}
.c-chev{width:52px;padding-right:0!important}
.chev .i{transition:transform var(--t)}
.chev[aria-expanded="true"] .i{transform:rotate(180deg)}
.pt .c-acts{width:1%;text-align:right}
.pt .c-acts .acts{justify-content:flex-end}
.c-sec .sub:first-child{margin-top:0;color:var(--text)}
.c-slots{white-space:nowrap}
.tbl tr.msg td{padding:0 12px 12px 64px}
.tbl tr.gh th{height:34px;background:var(--bg);font-weight:600}
.pt tbody.found{background:var(--accent-soft)}
.pt tbody.found tr.gh th{background:transparent;color:var(--accent-text);border-bottom:1px dashed var(--border)}
.sws{display:inline-flex;gap:4px;vertical-align:middle}
.sw{position:relative;width:16px;height:22px;border:1px solid var(--border-strong);border-radius:3px;background:var(--surface-2);overflow:hidden}
.sw i{position:absolute;left:0;right:0;bottom:0;background:var(--c)}
.sw.e{border-style:dashed;background:transparent}
.tbl tr.det>td{padding:0}
.pd{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--s5);padding:var(--s4) var(--s4) var(--s5) 64px;background:var(--surface-2);border-top:1px dashed var(--border)}
.slots{display:grid;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.slot{display:grid;grid-template-columns:30px 18px minmax(0,1fr) 112px;align-items:center;gap:10px;min-height:44px;padding:6px 12px;border-top:1px solid var(--border)}
.slot:first-child{border-top:0}
.chip{width:18px;height:18px;border:1px solid var(--border-strong);border-radius:4px;background:var(--c)}
.chip.e{background:transparent;border-style:dashed}
.lvl{display:flex;align-items:center;gap:8px}
.lvl .prog{flex:1}
.lvl .mono{width:36px;text-align:right}
.pa{display:grid;gap:var(--s3);align-content:start}
.alist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
.alist .btn{justify-content:flex-start;padding:0 10px;font-weight:500}
.dz{padding-top:var(--s3);border-top:1px solid var(--border)}
.kvl{display:grid;gap:6px;margin-top:var(--s3);font-size:var(--fs-m)}
.kvl div{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}

}

 switch(id){
 case 'bkNow':guard('back up now',()=>{if(runJob({title:'Backup',steps:['Collecting the database','Adding label photos (14.2 MB)','Adding settings and setup secrets','Writing the zip'],end:'Backup: done.',ms:4000,after:()=>{BK.unshift([now(),'made here','4,815 KiB',1]);renderBk();setFb('fb-bk','ok','Backup: done. It is at the top of the list.')}}))setFb('fb-bk','run','Backing up… follow it in the job panel.')});break;
 case 'keyCheck':setFb('fb-key','run','Checking the key…');later(1200,()=>setFb('fb-key','ok','The key works.'));break;
 case 'keyRep':$('#keyEd').hidden=false;$('#keyIn').focus();break;
 case 'keyCancel':$('#keyEd').hidden=true;$('#keyIn').value='';clearErrs($('#keyEd'));$('#keyRep').focus();break;
 case 'keySave':{const k=$('#keyIn');if(!k.value.trim()){fieldErr(k,'Paste the new key first. It starts with sk-ant-.');k.focus();break}
  guard('replace the API key',()=>{k.value='';$('#keyEd').hidden=true;$('#keySt').className='st ok sm';$('#keySt').textContent='API key set';setFb('fb-key','ok','Key replaced. Check it to be sure it works.');$('#keyCheck').focus()});break}
 case 'keyRem':confirmDlg({title:'Remove the API key?',text:'Remove the Anthropic API key? The Label Reader stops until a new key is set.',go:'Remove key',what:'remove the API key',ok:()=>{$('#keySt').className='st off sm';$('#keySt').textContent='API key not set';$('#keyMask').textContent='Not set';$('#keyRep').textContent='Set a key';setFb('fb-key','info','Key removed. The Label Reader is off until a key is set.')}});break;
 case 'nFw':notPart('Firewall rules','The firewall rules for remote access are shown here, ready to copy.');break;
 case 'nCert':toast('Certificate download started (mockup: no file).','info');break;
 case 'libUp':guard('update the Filament Catalog',()=>runJob({title:'Catalog update',steps:['Fetching the signed release list','Checking the signature','Comparing with 2026.11.2'],end:'Catalog update: done. 2026.11.2 is the newest.',ms:3000}));break;
 case 'libBack':confirmDlg({title:'Go back to the version before?',text:'Go back to the Catalog version before 2026.11.2? Your 3 local additions are kept.',go:'Go back',what:'go back to the Catalog version before',ok:()=>{later(50,()=>runJob({title:'Catalog rollback',steps:['Looking for the version before','Checking its signature'],end:'Catalog rollback: failed. The version before is not on the Hub any more; nothing changed.',fail:1,ms:2400}))}});break;
 case 'lAdd':{const ta=$('#lJson');clearErrs(ta.parentElement);let ok=true;try{const o=JSON.parse(ta.value);ok=o&&typeof o==='object'&&!Array.isArray(o)}catch(x){ok=false}
  if(!ta.value.trim()){fieldErr(ta,'Paste one entry as JSON first.');ta.focus();break}
  if(!ok){fieldErr(ta,'This is not valid JSON: check the brackets, quotes and commas.');ta.focus();break}
  guard('add a Catalog entry',()=>{ta.value='';setFb('fb-lib','ok','Entry added. 4 local additions now.')});break}
 case 'rsUp':{const f=$('#rsFile').files[0];$('#rsSum').innerHTML=line('run','Uploading and checking…');later(1200,()=>{$('#rsSum').innerHTML=line('ok','<b>'+esc(f?f.name:'backup.zip')+'</b> is a Spoolwarden backup and can be restored.');$('#rsType').disabled=false;$('#rsCancel').disabled=false;$('#rsType').focus()});break}
 case 'rsCancel':$('#rsType').value='';$('#rsType').disabled=true;$('#rsGo').disabled=true;t.closest('button').disabled=true;$('#rsSum').innerHTML='';$('#rsFile').value='';$('#rsUp').disabled=true;$('#rsFile').focus();break;
 case 'rsGo':guard('restore a backup',()=>notPart('Restore','Restoring runs as a job and restarts the Hub.'));break;
 }
}

  :'<pre class="loglines">2026-11-12 03:00:02  backup   nightly backup started\n2026-11-12 03:00:09  backup   done · 4,812 KiB\n2026-11-12 03:10:00  catalog  check ok · 2026.11.2</pre>')+

if(['light','dark','system'].indexOf(st)<0)st='system';

route();
})();
