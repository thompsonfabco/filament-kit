<title>Printers · Spoolwarden</title>
<style>
/* Layout concept: "Spool" - filament colours carry the page as spool rings on neutral warm chrome; pill tabs on top (tablet/desktop), big bottom bar on phones; tasks open as full-height step sheets. */
:root{
  color-scheme:light;
  --bg:#FAF6F1;--surface:#FFFFFF;--surface-2:#F3ECE3;--surface-3:#E9E0D4;
  --text:#2A2420;--muted:#665A50;--border:#E6DCD0;--border-strong:#8C7D6E;
  --accent:#F59A2E;--accent-hover:#EE8B18;--on-accent:#2A1806;--accent-ink:#9A4700;--accent-soft:#FDEBD3;--focus:#9A4700;
  --ok:#1A6E38;--ok-soft:#E2F2E7;--warn:#8A5800;--warn-soft:#FBEFD3;--bad:#B42318;--bad-soft:#FCE6E3;--on-bad:#FFFFFF;--info:#1F5FA8;--info-soft:#E1EBF7;
  --ring-track:#E6DBCD;--ring-edge:#C9BAA8;--ring-core:#F6F0E8;
  --scrim:rgba(42,36,32,.46);--toast-bg:#2A2420;--toast-text:#FAF6F1;
  --pv-light-bg:#FAF6F1;--pv-light-fg:#E6DBCD;--pv-dark-bg:#1A1613;--pv-dark-fg:#3A322B;--pv-dot:#F59A2E;
  --shadow-1:0 1px 2px rgba(70,45,20,.06),0 2px 10px rgba(70,45,20,.06);
  --shadow-2:0 2px 6px rgba(70,45,20,.08),0 12px 32px rgba(70,45,20,.12);
  --shadow-3:0 8px 24px rgba(70,45,20,.16),0 28px 70px rgba(70,45,20,.2);
  --font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --fs-xs:.8125rem;--fs-sm:.9375rem;--fs-md:1.0625rem;--fs-lg:1.25rem;--fs-xl:1.5rem;--fs-2xl:2rem;--fs-3xl:2.5rem;--lh:1.5;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:999px;
  --t-fast:120ms;--t-med:220ms;--t-slow:360ms;
  --tap:44px;--btn:48px;--btn-lg:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1A1613;--surface:#241F1B;--surface-2:#2D2722;--surface-3:#3A322B;
  --text:#F4EDE5;--muted:#BCAE9F;--border:#3A322B;--border-strong:#857565;
  --accent:#F7A445;--accent-hover:#FFB45C;--on-accent:#2A1806;--accent-ink:#FFBE73;--accent-soft:#3D2A14;--focus:#FFBE73;
  --ok:#72D69C;--ok-soft:#173424;--warn:#F2C46A;--warn-soft:#3A2C12;--bad:#FF8F85;--bad-soft:#43201B;--on-bad:#2A0B07;--info:#93BCF5;--info-soft:#1A2A40;
  --ring-track:#4D4239;--ring-edge:#75665A;--ring-core:#2D2722;
  --scrim:rgba(0,0,0,.62);--toast-bg:#F4EDE5;--toast-text:#1A1613;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --shadow-2:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.4);
  --shadow-3:0 8px 24px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1A1613;--surface:#241F1B;--surface-2:#2D2722;--surface-3:#3A322B;
  --text:#F4EDE5;--muted:#BCAE9F;--border:#3A322B;--border-strong:#857565;
  --accent:#F7A445;--accent-hover:#FFB45C;--on-accent:#2A1806;--accent-ink:#FFBE73;--accent-soft:#3D2A14;--focus:#FFBE73;
  --ok:#72D69C;--ok-soft:#173424;--warn:#F2C46A;--warn-soft:#3A2C12;--bad:#FF8F85;--bad-soft:#43201B;--on-bad:#2A0B07;--info:#93BCF5;--info-soft:#1A2A40;
  --ring-track:#4D4239;--ring-edge:#75665A;--ring-core:#2D2722;
  --scrim:rgba(0,0,0,.62);--toast-bg:#F4EDE5;--toast-text:#1A1613;
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --shadow-2:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.4);
  --shadow-3:0 8px 24px rgba(0,0,0,.45),0 28px 70px rgba(0,0,0,.5);
}

/* base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-md)/var(--lh) var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent-ink)}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.flip{transform:rotate(180deg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.skip{position:absolute;left:var(--s4);top:-80px;z-index:90;background:var(--accent);color:var(--on-accent);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-weight:700}
.skip:focus{top:var(--s3)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:.94em}
.h2{font-size:var(--fs-xl);font-weight:750;letter-spacing:-.01em;line-height:1.25}
.h3{font-size:var(--fs-lg);font-weight:700;line-height:1.3}
.hint{font-size:var(--fs-sm);color:var(--muted)}

/* chrome: top bar with pill tabs */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(var(--s3) + env(safe-area-inset-top)) max(var(--s5),env(safe-area-inset-right)) var(--s3) max(var(--s5),env(safe-area-inset-left))}
.top-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--s4)}
.brand{display:flex;align-items:center;gap:var(--s3);min-width:0;color:inherit;text-decoration:none;border-radius:var(--r-md);min-height:var(--tap)}
.brand svg{width:40px;height:40px;flex:none}
.brand span{min-width:0}
.brand b{display:block;font-size:var(--fs-lg);font-weight:800;letter-spacing:-.015em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-a{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round}
.logo-t{fill:none;stroke:var(--ring-track);stroke-width:14}
.logo-h{fill:var(--surface);stroke:var(--ring-edge);stroke-width:2}
.tabs{display:flex;gap:var(--s1);align-items:center}
.pill{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4) 0 var(--s3);border-radius:var(--r-pill);color:var(--text);text-decoration:none;font-weight:650;font-size:var(--fs-sm);border:0;background:transparent;white-space:nowrap;transition:background var(--t-fast)}
.pill .ico{width:20px;height:20px}
.pill:hover{background:var(--surface-2)}
.pill[aria-current="page"],.pill.on{background:var(--accent-soft);color:var(--accent-ink)}
.more{position:relative}
.menu{position:absolute;top:calc(100% + var(--s2));left:0;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--s2);z-index:30;animation:pop var(--t-med) ease-out}
.menu.r{left:auto;right:0}
.mi{display:flex;align-items:center;gap:var(--s3);min-height:48px;width:100%;padding:0 var(--s3);border-radius:var(--r-md);color:var(--text);text-decoration:none;font-weight:600;border:0;background:none;text-align:left}
.mi:hover{background:var(--surface-2)}
.mi[aria-current="page"],.mi[aria-checked="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.mh{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding:var(--s2) var(--s3) var(--s1)}
.mi+.mh{margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--border)}
.pill .ns{display:none}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2)}
.lock{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4) 0 var(--s3);border-radius:var(--r-pill);border:0;font-weight:700;font-size:var(--fs-sm);white-space:nowrap}
.lock .ico{width:20px;height:20px}
.lock[data-state="locked"]{background:var(--warn-soft);color:var(--warn)}
.lock[data-state="open"]{background:var(--ok-soft);color:var(--ok)}
.lk-s{display:none}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border)}
.seg label{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-pill);color:var(--muted);cursor:pointer;transition:background var(--t-fast)}
.seg label:hover{color:var(--text)}
.seg label:has(input:checked){background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow-1)}
.seg label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:1px}
.seg .ico{width:20px;height:20px}
.ib{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:var(--r-pill);border:0;background:transparent;color:var(--text);flex:none}
.ib:hover{background:var(--surface-2)}
.thm{position:relative;display:none}
.thm>.ib{background:var(--surface-2);border:1px solid var(--border)}

/* phone bottom bar */
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadow-2);padding:var(--s1) max(var(--s2),env(safe-area-inset-right)) calc(var(--s1) + env(safe-area-inset-bottom)) max(var(--s2),env(safe-area-inset-left))}
.bb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:var(--r-md);font-size:var(--fs-xs);font-weight:700;color:var(--muted);text-decoration:none;background:none;border:0;padding:0}
.bbi{display:grid;place-items:center;width:60px;height:34px;border-radius:var(--r-pill);transition:background var(--t-fast)}
.bb .ico{width:26px;height:26px}
.bb[aria-current="page"],.bb.on{color:var(--accent-ink)}
.bb[aria-current="page"] .bbi,.bb.on .bbi{background:var(--accent-soft)}

/* page */
main{display:block;max-width:1240px;margin:0 auto;padding:var(--s6) max(var(--s5),env(safe-area-inset-right)) 140px max(var(--s5),env(safe-area-inset-left))}
.view{animation:vin var(--t-med) ease-out}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s4) var(--s5);margin-bottom:var(--s6)}
.ph>div{min-width:0;flex:1 1 320px}
.ph h1{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ph p{color:var(--muted);margin-top:var(--s2);max-width:62ch}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);margin:var(--s7) 0 var(--s4)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--s5)}
.stack>*+*{margin-top:var(--s5)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--btn);padding:0 var(--s5);border-radius:var(--r-pill);border:1.5px solid transparent;font-weight:700;font-size:var(--fs-md);text-decoration:none;white-space:nowrap;transition:background var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast);line-height:1.2}
.btn .ico{width:22px;height:22px}
.btn:active:not([disabled]){transform:scale(.98)}
.btn-p{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-1)}
.btn-p:hover{background:var(--accent-hover)}
.btn-s{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-s:hover{background:var(--surface-2)}
.btn-g{background:transparent;color:var(--accent-ink)}
.btn-g:hover{background:var(--accent-soft)}
.btn-d{background:var(--bad);color:var(--on-bad)}
.btn-dq{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn-dq:hover{background:var(--bad-soft)}
.btn-sm{min-height:var(--tap);padding:0 var(--s4);font-size:var(--fs-sm)}
.btn-sm .ico{width:20px;height:20px}
.btn-lg{min-height:var(--btn-lg);padding:0 var(--s6);font-size:var(--fs-lg)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.acts{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.acts .push{margin-left:auto}

/* status pieces */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px var(--s3) 5px 9px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:700;white-space:nowrap;line-height:1.2}
.badge .ico{width:18px;height:18px}
.badge.sm{font-size:var(--fs-xs);padding:3px 10px 3px 7px}
.badge.sm .ico{width:16px;height:16px}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.t-info{background:var(--info-soft);color:var(--info)}
.t-acc{background:var(--accent-soft);color:var(--accent-ink)}
.t-neutral{background:var(--surface-2);color:var(--muted)}
.res{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:600;margin-top:var(--s4);line-height:1.4}
.res:empty{display:none}
.res .ico{width:20px;height:20px}
.res .grow{flex:1;min-width:0}
.note{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-md);font-weight:600;line-height:1.45}
.bar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;margin-top:var(--s2)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width var(--t-slow) ease}
.spin{display:inline-block;width:20px;height:20px;flex:none;border-radius:50%;border:3px solid var(--ring-track);border-top-color:var(--accent-ink);animation:spin .8s linear infinite}
.spin.lg{width:28px;height:28px;border-width:4px}

/* spool rings */
.ring{flex:none;display:block}
.rc{fill:var(--ring-core)}
.rt{fill:none;stroke:var(--ring-track);stroke-width:14}
.ra{fill:none;stroke-width:14;stroke-linecap:round}
.rae{fill:none;stroke:var(--border-strong);stroke-width:17;stroke-linecap:round}
.re{fill:none;stroke:var(--ring-edge);stroke-width:1.2}
.rh{fill:var(--surface);stroke:var(--ring-edge);stroke-width:1.5}
.rempty{fill:none;stroke:var(--ring-edge);stroke-width:2.5;stroke-dasharray:5 6}
.sw{display:inline-block;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ring-edge);flex:none;vertical-align:middle}

/* printers */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:var(--s5);align-items:start}
.pc{display:flex;flex-direction:column}
.pc-h{display:flex;gap:var(--s3) var(--s4);align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.pc-h>div{min-width:0}
.pc h2{font-size:var(--fs-xl);font-weight:780;letter-spacing:-.015em;line-height:1.2}
.pc .model{color:var(--muted);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.fact{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--muted);background:var(--surface-2);border-radius:var(--r-pill);padding:4px var(--s3) 4px 9px;min-width:0;max-width:100%}
.fact .ico{width:16px;height:16px}
.fact span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:var(--s5) 0;padding:var(--s4) var(--s3);background:var(--surface-2);border-radius:var(--r-md)}
.slots.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.slot .ring{width:84px;height:84px;margin-bottom:var(--s1)}
.slot .sl{font-weight:800;font-size:var(--fs-sm);display:flex;gap:6px;align-items:baseline}
.slot .sp{font-weight:800;font-size:var(--fs-lg);line-height:1.1}
.slot .sn{font-size:var(--fs-xs);color:var(--muted);line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.slots-off{display:flex;gap:var(--s3);align-items:center;margin:var(--s5) 0;padding:var(--s4);background:var(--surface-2);border-radius:var(--r-md);color:var(--muted);font-size:var(--fs-sm)}
.problem{margin-top:var(--s4)}
.pc .acts{margin-top:auto}
.found{border:2px dashed var(--border-strong);background:transparent;box-shadow:none}
.found .fi{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.found-b{display:flex;gap:var(--s4);align-items:flex-start;margin-bottom:var(--s5)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--s5);align-items:start}
.tcard-h{display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s3)}
.tcard-h .ti{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);background:var(--surface-2);color:var(--accent-ink);flex:none}
.code{position:relative;margin:var(--s4) 0 var(--s3);padding:var(--s4);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);font:500 var(--fs-xs)/1.6 var(--mono);white-space:pre-wrap;word-break:break-all}
.linkcard{display:flex;gap:var(--s4);align-items:center;text-decoration:none;color:inherit}
.linkcard:hover{background:var(--surface-2)}
.linkcard .chev{margin-left:auto;color:var(--muted)}
.empty{text-align:center;padding:var(--s7) var(--s5);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.empty p{color:var(--muted);max-width:44ch}
.empty .btn{margin-top:var(--s3)}
.prev-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-top:var(--s7);padding:var(--s3) var(--s4) var(--s3) var(--s5);border-radius:var(--r-lg);border:1px dashed var(--border-strong);color:var(--muted);font-size:var(--fs-sm)}
.prev-row b{color:var(--text)}

/* switch */
.swr{display:flex;align-items:center;gap:var(--s2)}
.switch{position:relative;width:64px;height:44px;border:0;background:none;padding:0;flex:none}
.switch::before{content:"";position:absolute;left:4px;right:4px;top:8px;bottom:8px;border-radius:var(--r-pill);background:var(--surface-3);border:1.5px solid var(--border-strong);transition:background var(--t-fast)}
.switch::after{content:"";position:absolute;left:11px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform var(--t-fast)}
.switch[aria-checked="true"]::before{background:var(--accent);border-color:var(--accent-ink)}
.switch[aria-checked="true"]::after{transform:translateX(26px);background:var(--on-accent)}
.swv{font-size:var(--fs-sm);font-weight:700;min-width:2.2em}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 var(--s5);min-width:0;border:0;padding:0}
.field>label,.lbl{font-weight:700;font-size:var(--fs-sm)}
.inp{min-height:var(--btn);width:100%;padding:10px var(--s4);border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);transition:border-color var(--t-fast)}
.inp:hover{border-color:var(--text)}
.inp:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.inp::placeholder{color:var(--muted);opacity:1}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}

/* intake */
.tbl{width:100%;border-collapse:separate;border-spacing:0}

.ic{display:flex;gap:var(--s4);align-items:flex-start;text-decoration:none;color:inherit;padding:var(--s4) var(--s5) var(--s4) var(--s4)}
.ic:hover{background:var(--surface-2)}

.ic b{display:block;font-size:var(--fs-lg);line-height:1.3}
.ic .meta{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.ic .badges{margin-top:var(--s2)}
.ic .chev{margin-left:auto;color:var(--muted);align-self:center}
.ic>div{min-width:0;flex:1}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.dhero{display:flex;gap:var(--s5);align-items:center;margin:var(--s4) 0 var(--s5)}
.dhero h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dhero .meta{color:var(--muted);margin:var(--s1) 0 var(--s3)}
.dhero>div{min-width:0}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"a b" "c b" "d b";grid-template-rows:auto auto 1fr;gap:var(--s5);align-items:start}
.ga{grid-area:a}.gb{grid-area:b}.gc{grid-area:c}.gd{grid-area:d}
.fgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:var(--s5);align-items:start}
.photos{display:flex;gap:var(--s3);margin-top:var(--s4);flex-wrap:wrap}
.photo{padding:0;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);width:132px;height:100px;flex:none}

.kv>div{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:var(--s1) var(--s4);padding:var(--s3) 0;border-top:1px solid var(--border);align-items:center}

/* settings */
.set{display:grid;grid-template-columns:290px minmax(0,1fr);gap:var(--s6);align-items:start}

.srow{display:flex;align-items:center;gap:var(--s3);min-height:60px;width:100%;padding:var(--s2) var(--s3);border-radius:var(--r-md);border:0;background:none;text-align:left;color:var(--text)}

.spanel{padding:var(--s6)}

.spanel h3{margin:var(--s6) 0 var(--s3)}
.spanel form h3:first-child{margin-top:var(--s6)}
.sback{display:none;margin:0 0 var(--s3) calc(-1 * var(--s3))}
.sfoot{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);padding-top:var(--s5);border-top:1px solid var(--border)}
.sstat{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:700}
.sstat:empty{display:none}
.sstat .ico{width:20px;height:20px}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}.s-mut{color:var(--muted)}
.tcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.tcard{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);border-radius:var(--r-md);border:1.5px solid var(--border-strong);cursor:pointer;background:var(--surface);font-weight:700}
.tcard:has(input:checked){border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink);background:var(--accent-soft);color:var(--accent-ink)}

.tprev{display:block;height:64px;border-radius:var(--r-sm);position:relative;overflow:hidden;border:1px solid var(--border)}
.tprev i{position:absolute;left:10px;right:10px;height:10px;border-radius:var(--r-pill)}
.tprev i:first-child{top:12px;right:40%}.tprev i:last-child{top:32px}
.tprev b{position:absolute;right:10px;top:10px;width:16px;height:16px;border-radius:50%;background:var(--pv-dot)}
.tp-l{background:var(--pv-light-bg)}.tp-l i{background:var(--pv-light-fg)}
.tp-d{background:var(--pv-dark-bg)}.tp-d i{background:var(--pv-dark-fg)}
.tp-s{background:linear-gradient(110deg,var(--pv-light-bg) 50%,var(--pv-dark-bg) 50%)}.tp-s i{background:linear-gradient(110deg,var(--pv-light-fg) 50%,var(--pv-dark-fg) 50%)}
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.look{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:var(--s3);border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);text-align:left;min-width:0}
.look:hover{border-color:var(--text)}
.look:active{background:var(--surface-2)}

.look small{font-size:var(--fs-sm);color:var(--muted);line-height:1.3}
.look .lck{display:none;position:absolute;top:calc(var(--s3) + 6px);right:calc(var(--s3) + 6px);place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-1)}

.look[aria-pressed="true"] .lck{display:grid}
.lpv{display:block;position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border);margin-bottom:var(--s2)}

.keyrow{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);align-items:center;justify-content:space-between;padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2)}
.keyrow>div:first-child{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);align-items:center}

.rsteps{counter-reset:rs;display:grid;gap:var(--s4)}

.rsteps .acts{margin-top:var(--s2)}
.libstat{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2)}
.libstat .ti{display:grid;place-items:center;width:52px;height:52px;border-radius:var(--r-md);background:var(--surface);color:var(--accent-ink);flex:none}
.filename{font-size:var(--fs-sm);color:var(--muted);overflow-wrap:anywhere}
input[type=file].vh:focus-visible+label{outline:3px solid var(--focus);outline-offset:3px}

/* placeholders */
.place .prows{margin-top:var(--s4)}
.prows li{display:flex;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--border)}
.prows li:first-child{border-top:0}
.prows .pi{display:grid;place-items:center;width:48px;height:48px;border-radius:var(--r-md);background:var(--surface-2);color:var(--accent-ink);flex:none}
.prows small{display:block;color:var(--muted);font-size:var(--fs-sm)}
.swrow{display:flex;gap:6px;margin-top:6px}
.swrow .sw{width:22px;height:22px}

/* layers: dialogs and full-height sheets */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade var(--t-med)}
.dlg{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-3);width:min(100%,500px);max-height:calc(100vh - 48px);overflow:auto;padding:var(--s6);animation:pop var(--t-med) ease-out}
.dlg.wide{width:min(100%,720px)}
.dh{display:flex;align-items:center;gap:var(--s3);font-size:var(--fs-xl);font-weight:780;letter-spacing:-.01em;line-height:1.25;margin-bottom:var(--s2)}
.dh .hi{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;flex:none}
.dp{color:var(--muted);margin-bottom:var(--s5)}
.dfoot{display:flex;gap:var(--s3);justify-content:flex-end;flex-wrap:wrap;margin-top:var(--s5)}
.mgroup+.mgroup{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--border)}
.mgroup h3{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 var(--s2) var(--s3)}
.mrow{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:var(--s2) var(--s3);border-radius:var(--r-md);border:0;background:none;text-align:left;color:var(--text)}
.mrow:hover{background:var(--surface-2)}
.mrow>.ico:first-child{color:var(--accent-ink)}
.mrow b{display:block;font-weight:700}
.mrow small{display:block;color:var(--muted);font-size:var(--fs-sm)}
.mrow .chev{margin-left:auto;color:var(--muted)}
.mgroup.danger .mrow,.mgroup.danger .mrow>.ico:first-child{color:var(--bad)}
.mgroup.danger .mrow:hover{background:var(--bad-soft)}
.mtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-top:var(--s4)}
.mgroup .mtiles{margin-top:var(--s2)}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s2);padding:var(--s4);min-height:96px;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);text-decoration:none;font-weight:700}
.mtile .ico{width:28px;height:28px;color:var(--accent-ink)}
.mtile[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px var(--accent-ink)}
.layer.k-sheet{justify-content:flex-end;align-items:stretch;padding:0}
.sheet{position:relative;display:flex;flex-direction:column;background:var(--bg);width:min(100%,640px);height:100%;border-radius:var(--r-lg) 0 0 var(--r-lg);box-shadow:var(--shadow-3);animation:sin var(--t-slow) cubic-bezier(.2,.8,.2,1)}
.sh-h{padding:calc(var(--s5) + env(safe-area-inset-top)) var(--s6) var(--s4);border-bottom:1px solid var(--border);background:var(--surface);border-radius:inherit;border-bottom-left-radius:0}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.eyebrow{font-size:var(--fs-sm);font-weight:800;color:var(--accent-ink);margin-bottom:2px}
.sh-h h2{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.sh-b{flex:1;overflow:auto;padding:var(--s6)}
.sh-f{display:flex;gap:var(--s3);justify-content:space-between;align-items:center;padding:var(--s4) var(--s6) calc(var(--s4) + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface)}
.sh-f .btn-p{min-width:180px}
.steps{display:flex;gap:var(--s2);margin-top:var(--s4);counter-reset:st}
.steps li{flex:1;display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);font-weight:700;color:var(--muted);min-width:0}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--border-strong);flex:none;font-weight:800;background:var(--surface)}
.steps li[aria-current="step"]{color:var(--text)}

.steps li.done::before{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.steps li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kinds{display:grid;gap:var(--s4);border:0;margin:0;padding:0}
.kinds .opt{padding:var(--s5)}
.kinds .opt b{font-size:var(--fs-lg)}
.sumlist>div{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:var(--s4);padding:var(--s3) 0;border-top:1px solid var(--border)}
.sumlist>div:first-child{border-top:0}
.sumlist dt{color:var(--muted)}
.sumlist dd{font-weight:700;overflow-wrap:anywhere}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s4);padding:var(--s7) var(--s4)}
.wait .spin{width:56px;height:56px;border-width:6px}

/* dock: toasts and the background job */
.dock{position:fixed;z-index:40;right:max(var(--s5),env(safe-area-inset-right));bottom:calc(var(--s5) + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:stretch;gap:var(--s3);width:min(420px,calc(100vw - 32px));pointer-events:none}

#toasts{display:flex;flex-direction:column;gap:var(--s2);pointer-events:none}

.toast .ib{color:inherit}
.toast .ib:hover{background:transparent;opacity:.8}
.job{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--s4);animation:pop var(--t-med) ease-out}
.jh{display:flex;align-items:center;gap:var(--s3)}
.ji{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface-2);flex:none}
.job.done .ji{background:var(--ok-soft);color:var(--ok)}
.job.fail .ji{background:var(--bad-soft);color:var(--bad)}
.jt{flex:1;min-width:0}
.jt b{display:block;line-height:1.25}
.js{display:block;font-size:var(--fs-sm);color:var(--muted)}
.job.done .js{color:var(--ok);font-weight:700}
.job.fail .js{color:var(--bad);font-weight:700}
.jlog{margin-top:var(--s3);padding:var(--s3) var(--s4);background:var(--surface-2);border-radius:var(--r-md);font:500 var(--fs-xs)/1.7 var(--mono);color:var(--muted);counter-reset:jl}
.jlog li::before{counter-increment:jl;content:counter(jl) "  ";color:var(--muted)}

/* motion */
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes sin{from{transform:translateX(48px);opacity:0}}
@keyframes up{from{transform:translateY(48px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

/* desktop only */
@media (min-width:1025px){.tb-only{display:none!important}}
/* low desktop: tabs follow the brand so they never run under the tools */
@media (min-width:1025px) and (max-width:1199px){.top-in{grid-template-columns:minmax(0,1fr) auto auto}}
@media (min-width:1025px) and (max-width:1119px){.tabs .pill{padding:0 var(--s4)}.tabs .pill>.ico:first-child{display:none}}
/* short labels where the pill row is tight */

/* ---------- layers: dialogs and sheets (focus trapped, Escape closes) ---------- */
var stack=[], FOC='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
function openLayer(html,kind,o){
  o=o||{};
  if(openMenu)setMenu(openMenu.btn,openMenu.menu,false);
  var L=document.createElement('div');
  L.className='layer k-'+kind;
  L.innerHTML='<div class="scrim" data-close></div><div class="'+(kind==='sheet'?'sheet':'dlg')+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" tabindex="-1">'+html+'</div>';
  var p=L.lastChild;
  if(o.label)p.setAttribute('aria-label',o.label);
  else{var h=p.querySelector('h2');if(h){h.id=h.id||'lh'+Date.now()+stack.length;p.setAttribute('aria-labelledby',h.id)}}
  stack.forEach(function(s){s.el.inert=true});
  document.body.appendChild(L);
  stack.push({el:L,p:p,prev:document.activeElement,onClose:o.onClose});
  $('#app').inert=true;$('.dock').inert=true;document.body.style.overflow='hidden';
  L.addEventListener('click',function(e){
    if(e.target.closest('[data-close]'))closeLayer(p);
    else if(e.target.closest('[data-close-nav]'))closeLayer(p,true);
  });
  var f=p.querySelector('[autofocus]')||p.querySelector('input:not([type=hidden]):not(.vh),textarea')||p.querySelector(FOC);
  (f||p).focus();
  return p;
}
function closeLayer(p,noFocus){
  for(var i=stack.length-1;i>=0;i--){
    if(stack[i].p===p){
      var s=stack.splice(i,1)[0];s.el.remove();
      if(s.onClose)s.onClose();
      if(stack.length)stack[stack.length-1].el.inert=false;
      else{$('#app').inert=false;$('.dock').inert=false;document.body.style.overflow=''}
      if(!noFocus&&s.prev&&document.contains(s.prev))s.prev.focus();
      return;
    }
  }
}
function topLayer(){return stack.length?stack[stack.length-1].p:null}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(openMenu){var b=openMenu.btn;setMenu(b,openMenu.menu,false);b.focus();return}
    if(stack.length){e.preventDefault();closeLayer(topLayer())}
    return;
  }
  if(e.key==='Tab'&&stack.length){
    var p=topLayer(), f=$$(FOC,p).filter(function(x){return x.getClientRects().length||x.classList.contains('vh')});
    if(!f.length){e.preventDefault();return}
    var a=f[0], z=f[f.length-1], cur=document.activeElement;
    if(e.shiftKey&&(cur===a||cur===p||!p.contains(cur))){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&(cur===z||!p.contains(cur))){e.preventDefault();a.focus()}
  }
});

var J=null;
function runJob(title,lines,doneTxt,ms,after){
  if(J&&J.run){toast('A job is already running. Follow it in the job card.','info');return false}
  J={title:title,lines:[],run:true,open:J?J.open:false,pct:4,state:'Starting',ok:true};
  drawJob();say(title+': started.');
  var i=0, step=ms/lines.length;
  (function tick(){
    if(i<lines.length){J.lines.push(lines[i]);J.state=lines[i];J.pct=Math.round((i+1)/(lines.length+1)*100);i++;drawJob();later(tick,step)}
    else{J.run=false;J.pct=100;J.state=doneTxt;J.lines.push(doneTxt);drawJob();say(doneTxt);if(after)after()}
  })();

function pRes(p){return $('#r-'+p.id)}
function testConn(p,btn){
  var r=pRes(p);btn.disabled=true;
  res(r,'neutral','spin','Testing the connection to <span class="mono">'+esc(p.addr)+'</span>…');
  later(function(){
    btn.disabled=false;
    if(p.state==='off')res(r,'bad','alert','No answer from <span class="mono">'+esc(p.addr)+':8883</span>: check that it is on.');
    else if(p.kind==='bambu')res(r,'ok','check','<span class="mono">'+esc(p.addr)+'</span> answers; its certificate matches the pinned one.');
    else res(r,'ok','check','<span class="mono">'+esc(p.addr)+'</span> answers; Moonraker accepts the API key.');
  },1500);
}
function stepped(p,btn,word,n,end){
  var r=pRes(p);btn.disabled=true;var i=1;
  (function next(){
    if(i<=n){res(r,'neutral','spin',word+'… step '+i+' of '+n+'<div class="bar"><i style="width:'+Math.round(i/n*100)+'%"></i></div>');i++;later(next,800)}
    else{btn.disabled=false;res(r,'ok','check',end)}
  })();
}

    ['Remove',[['forgetcert','Forget certificate','cert','Pins the new one at the next connection'],['forget','Forget printer','trash','Its Access Code is deleted']],1]
  ]:[
    ['This printer',[['rename','Rename','pencil'],['addr','Change address','globe'],['apikey',(p.key?'Replace or clear':'Set')+' Moonraker API key','key'],['lane','Lane data','spool','Now: '+p.lane]]],
    ['Slots',[['detect','Detect model and slots','search'],['loadmap','Map by loading filament','spool','Load a spool and the Hub notices the slot']]],

function printerAction(a,p,btn){
  var r=p?pRes(p):null;
  if(btn&&btn.focus&&document.contains(btn))btn.focus();
  switch(a){
  case 'test':testConn(p,btn);break;
  case 'map':needCode(function(){
    if(p.state==='off'){res(pRes(p),'bad','alert','No answer from <span class="mono">'+esc(p.addr)+'</span>, so the slots cannot be mapped now. Check that it is on.');return}
    stepped(p,$('#pc-'+p.id+' [data-pa="map"]')||btn,'Mapping',4,p.slots?'Slots: '+p.slots.map(function(s){return s[0]}).join(', '):'Slots mapped. They show here once the printer reports them.')});break;
  case 'detect':needCode(function(){stepped(p,$('#pc-'+p.id+' [data-pa="detect"]')||btn,'Detecting',3,'Voron 2.4 with slots T0 and T1. Nothing changed.')});break;
  case 'report':if(runJob('Printer report: '+p.name,['Asking the printer for its log…','Adding the last two slot mappings…','Packing the report…'],'Printer report: done. It is under Saved reports.',3200))res(r,'info','info','Collecting a report. Follow it in the job card.');break;
  case 'saved':notHere('The saved reports list');break;
  case 'loadmap':res(r,'info','spool','Load a spool into any slot now; the Hub notices which slot it went into. (Only described in this mockup.)');break;
  case 'rename':formDlg({title:'Rename printer',icon:'pencil',fields:[{id:'nm',label:'Name',value:p.name,hint:'Shown on this page and on the Weigh Station display.'}],ok:'Save name',
    check:function(v){return v.nm?null:['nm','Enter a name, or keep the old one.']},
    done:function(v){if(v.nm===p.name){res(r,'neutral','info','Nothing changed.');return}needCode(function(){var o=p.name;p.name=v.nm;renderPrinters();res(pRes(p),'ok','check','Renamed “'+esc(o)+'” to “'+esc(v.nm)+'”.')})}});break;
  case 'addr':formDlg({title:'Change address',icon:'globe',fields:[{id:'ad',label:p.kind==='bambu'?'IP address or name':'Address',value:p.addr,mono:true,ph:p.kind==='bambu'?'e.g. 192.0.2.40 or printer.local':'e.g. voron.example:7125'}],ok:'Save address',
    check:function(v){return v.ad?null:['ad','Enter the printer’s address.']},
    done:function(v){if(v.ad===p.addr){res(r,'neutral','info','Nothing changed.');return}needCode(function(){p.addr=v.ad;renderPrinters();res(pRes(p),'ok','check','Address saved. Test the connection to check it.')})}});break;
  case 'code':formDlg({title:'Replace Access Code',icon:'key',intro:'The Hub keeps the code secret; it is never shown again.',fields:[{id:'ac',label:'New Access Code',type:'password',hint:'On the printer: Settings > Network/LAN',attrs:' autocomplete="off"'}],ok:'Replace code',
    check:function(v){return v.ac?null:['ac','Enter the Access Code shown on the printer.']},
    done:function(){needCode(function(){res(pRes(p),'ok','check','Access Code replaced. Test the connection to check it.')})}});break;
  case 'apikey':var fp=formDlg({title:'Moonraker API key',icon:'key',intro:'Now: '+(p.key?'a key is set.':'no key set.'),fields:[{id:'ak',label:p.key?'Replace with a new key':'API key',type:'password',attrs:' autocomplete="off"'}],ok:p.key?'Replace key':'Set key',
    extra:p.key?'<button class="btn btn-dq" type="button" id="clr" style="margin-right:auto">'+I('trash')+'Clear key</button>':'',
    check:function(v){return v.ak?null:['ak','Paste the key from Moonraker, or cancel.']},
    done:function(){needCode(function(){p.key=true;renderPrinters();res(pRes(p),'ok','check','API key saved.')})}});
    var c=$('#clr',fp);if(c)c.onclick=function(){closeLayer(fp);needCode(function(){p.key=false;renderPrinters();res(pRes(p),'ok','check','API key cleared.')})};break;
  case 'lane':formDlg({title:'Lane data',icon:'spool',fields:[{id:'ln',type:'radio',label:'Use lane data from the printer',value:p.lane,options:[['auto','Auto','Use it when the printer reports lanes'],['on','On','Always use it'],['off','Off','Never use it']]}],ok:'Save',
    done:function(v){if(v.ln===p.lane){res(r,'neutral','info','Nothing changed.');return}needCode(function(){p.lane=v.ln;renderPrinters();res(pRes(p),'ok','check','Lane data: '+v.ln+'.')})}});break;
  case 'forgetcert':confirmDlg('Forget the certificate?','The Hub forgets the certificate pinned for '+esc(p.name)+' and pins the one it sees at the next connection.','Forget certificate',function(){needCode(function(){res(pRes(p),'ok','check','Certificate forgotten. The next connection pins a new one.')})});break;
  case 'forget':confirmDlg('Forget '+p.name+'?','Its '+(p.kind==='bambu'?'Access Code':'API key')+' is deleted.','Forget',function(){needCode(function(){P=P.filter(function(x){return x!==p});renderPrinters();toast(p.name+' forgotten.','ok','trash');$('#v-printers h1').focus()})});break;
  }
}

function applyChanges(ch,by,state){
  Object.keys(ch).forEach(function(k){V[k]=ch[k][1]});
  REV.push({n:REV.length+1,at:'Just now',by:by,ch:ch});
  REC[0].st=state;
}
function diffList(ch){return '<ul class="diff">'+Object.keys(ch).map(function(k){return '<li><b>'+LBL[k]+'</b><span class="ba"><s>'+(esc(ch[k][0])||'Empty')+'</s>'+I('arrow')+'<span>'+(esc(ch[k][1])||'Empty')+'</span></span></li>'}).join('')+'</ul>'}
function sheetHead(eye,title,steps,cur){
  return '<div class="sh-h"><div class="sh-top"><div><p class="eyebrow">'+eye+' · step '+cur+' of '+steps.length+'</p><h2 tabindex="-1">'+title+'</h2></div><button class="ib" type="button" data-close><span class="vh">Close</span>'+I('x')+'</button></div><ol class="steps" aria-label="Steps">'+steps.map(function(l,i){return '<li'+(i+1===cur?' aria-current="step"':'')+(i+1<cur?' class="done"':'')+'><span>'+l+(i+1<cur?'<span class="vh"> (done)</span>':'')+'</span></li>'}).join('')+'</ol></div>';
}
/* edit by hand: sheet, 2 steps */
function openHand(){
  var D=Object.assign({},V), step=1, p=openLayer('<div id="hs" style="display:contents"></div>','sheet',{label:'Edit by hand'});
  function changes(){var c={};Object.keys(V).forEach(function(k){if((D[k]||'')!==(V[k]||''))c[k]=[V[k],D[k]]});return c}
  function draw(){
    var b, ch=changes(), n=Object.keys(ch).length;
    if(step===1)b='<p class="hint" style="margin-bottom:var(--s5)">Change only what is wrong. Only changed fields are sent.</p><form id="hf" novalidate>'+F.map(function(g){return '<h3 class="h3" style="margin:var(--s5) 0 var(--s3)">'+g[0]+'</h3><div class="fgrid">'+g[1].map(function(f){var c=CONF[f[2]];return fieldHTML({id:'h-'+f[0],label:f[1],value:D[f[0]],hint:c?c[2]:'',mono:f[0]==='colour',ph:f[0]==='price'?'e.g. 24.90':''}).replace(/name="h-/,'name="')}).join('')+'</div>'}).join('')+'<button hidden></button></form>';
    else b=n?'<p class="hint" style="margin-bottom:var(--s4)">'+n+' field'+(n>1?'s':'')+' will be saved. Nothing else is sent.</p>'+diffList(ch):'<div class="card empty" style="box-shadow:none">'+I('info')+'<h3 class="h3">Nothing changed.</h3><p>Go back to change a field, or close this sheet.</p></div>';
    $('#hs').innerHTML=sheetHead('Edit by hand',step===1?'Change the fields':'Check and save',['Change fields','Check and save'],step)+'<div class="sh-b">'+b+'</div><div class="sh-f">'+(step===1?'<button class="btn btn-s" type="button" data-close>Cancel</button><button class="btn btn-p" type="button" id="hn">Next: check'+I('chev-r')+'</button>':'<button class="btn btn-s" type="button" id="hb">'+I('chev-l')+'Back</button><button class="btn btn-p" type="button" id="hn">'+I('check')+'Save changes</button>')+'</div>';
    $('#hs h2').focus();
    var f=$('#hf');if(f)f.addEventListener('submit',function(e){e.preventDefault();$('#hn').click()});
    if($('#hb'))$('#hb').onclick=function(){step=1;draw()};
    $('#hn').onclick=function(){
      if(step===1){Object.assign(D,formVals($('#hf')));step=2;draw();return}
      var ch2=changes();
      if(!Object.keys(ch2).length){closeLayer(p,true);renderDetail(['neutral','info','Nothing changed.']);$('#d-res').previousElementSibling.querySelector('[data-d="hand"]').focus();return}
      needCode(function(){applyChanges(ch2,'by hand','hand');closeLayer(p,true);renderDetail(['ok','check','Saved: '+Object.keys(ch2).map(function(k){return LBL[k]}).join(', ')+'. Added as revision '+REV.length+'.']);$('#v-recent-detail h1').focus()});
    };
  }
  draw();
}
/* ask the AI: sheet, 3 steps */
function openAI(){
  var step=1, ask='', p=openLayer('<div id="as" style="display:contents"></div>','sheet',{label:'Ask the AI to correct it'}), timer;
  var prop={}, want={name:'PolyTerra PLA Charcoal Black (Matte)',nrange:'190-220 C'};
  Object.keys(want).forEach(function(k){if(V[k]!==want[k])prop[k]=[V[k],want[k]]});
  var np=Object.keys(prop).length, names=Object.keys(prop).map(function(k){return LBL[k]}).join(', ');
  function draw(){
    var b, foot;
    if(step===1){b='<form id="af" novalidate>'+fieldHTML({id:'ask',type:'textarea',label:'What is wrong with this record?',ph:'e.g. brand is Polymaker',value:ask,hint:'The AI reads the photos again with your hint and proposes changes. Nothing is saved until you accept.'})+'</form>';foot='<button class="btn btn-s" type="button" data-close>Cancel</button><button class="btn btn-p" type="button" id="an">'+I('spark')+'Ask the AI</button>'}
    else if(step===2){b='<div class="wait" role="status"><span class="spin"></span><h3 class="h3">Asking the AI… (up to a minute)</h3><p class="hint">You can close this sheet; nothing changes until you accept a proposal.</p></div>';foot='<button class="btn btn-s" type="button" data-close>Cancel</button><button class="btn btn-p" type="button" disabled>'+I('check')+'Accept</button>'}
    else if(!np){b='<div class="card empty" style="box-shadow:none">'+I('info')+'<h3 class="h3">The AI proposes no changes.</h3><p>It read the photos again with your hint: “'+esc(ask)+'”. The record already matches.</p></div>';foot='<button class="btn btn-p" type="button" id="ad">'+I('check')+'Close</button>'}
    else{b='<p class="hint" style="margin-bottom:var(--s4)">The AI proposes '+np+' change'+(np>1?'s':'')+'. Your hint: “'+esc(ask)+'”</p>'+diffList(prop);foot='<button class="btn btn-s" type="button" id="ad">'+I('x')+'Discard</button><button class="btn btn-p" type="button" id="aa">'+I('check')+'Accept</button>'}
    $('#as').innerHTML=sheetHead('Ask the AI to correct it',['Say what is wrong','Asking the AI…','Accept or discard'][step-1],['Say what is wrong','Wait','Accept or discard'],step)+'<div class="sh-b">'+b+'</div><div class="sh-f">'+foot+'</div>';
    $('#as h2').focus();
    if(step===1){
      $('#af').addEventListener('submit',function(e){e.preventDefault()});
      $('#an').onclick=function(){var t=$('#f-ask');ask=t.value.trim();if(!ask){fieldErr(t,'Write what is wrong, for example the brand or a temperature.');t.focus();return}step=2;draw();say('Asking the AI… (up to a minute)');timer=later(function(){if(document.contains(p)){step=3;draw()}},2000)};
    }
    if(step===3){
      $('#ad').onclick=function(){closeLayer(p,true);renderDetail(['neutral','info',np?'Proposal discarded. Nothing changed.':'The AI proposed no changes. Nothing changed.']);$('#v-recent-detail h1').focus()};
      if(np)$('#aa').onclick=function(){needCode(function(){applyChanges(prop,'by AI','ai');closeLayer(p,true);renderDetail(['ok','check','Accepted the AI’s proposal: '+names+'. Added as revision '+REV.length+'.']);$('#v-recent-detail h1').focus()})};
    }
  }
  draw();
}
$('#v-recent-detail').addEventListener('click',function(e){
  var b=e.target.closest('[data-d],[data-undo],[data-photo],[data-rec]');if(!b)return;
  if(b.dataset.rec){e.preventDefault();S.rec=+b.dataset.rec;renderDetail();$('#v-recent-detail h1').focus();return}
  if(b.dataset.d==='hand')return openHand();
  if(b.dataset.d==='ai')return openAI();
  if(b.dataset.photo){var r=REC.filter(function(x){return x.id===S.rec})[0],i=+b.dataset.photo;openLayer('<h2 class="dh">Photo '+(i+1)+' of '+r.ph+'</h2><p class="hint">'+esc(r.name)+' · placeholder drawing, the mockup has no real photos.</p><div class="lb">'+photo(r.c,i)+'</div><div class="dfoot"><button class="btn btn-p" type="button" data-close>Close</button></div>','dlg',{wide:1});return}
  if(b.dataset.undo){var v=REV.filter(function(x){return x.n===+b.dataset.undo})[0];needCode(function(){Object.keys(v.ch).forEach(function(k){V[k]=v.ch[k][0]});v.undone=true;renderDetail(['ok','undo','Revision '+v.n+' undone: '+revTxt({ch:Object.keys(v.ch).reduce(function(o,k){o[k]=[v.ch[k][1],v.ch[k][0]];return o},{})})+'.']);$('#v-recent-detail h1').focus()})}
});

    '<h3 class="h3">Restore</h3><ol class="rsteps"><li><div><b>Choose a zip</b><div class="acts"><input class="vh" type="file" id="rsFile" accept=".zip,application/zip"><label class="btn btn-s btn-sm" for="rsFile">'+I('upload')+'Choose a zip</label><span class="filename" id="rsName">No file chosen</span></div></div></li><li><div><b>Upload and check</b><p class="hint">The Hub checks the zip and shows a summary of what is inside before anything changes.</p><div class="acts"><button class="btn btn-s btn-sm" type="button" id="rsUp" disabled>'+I('upload')+'Upload and check</button></div></div></li><li><div><b>Type restore to go on</b><p class="hint">Restoring replaces everything the Hub keeps now.</p>'+fieldHTML({id:'rsType',label:'Type restore to go on',ph:'restore',attrs:' autocomplete="off" disabled'})+'<div class="acts" style="margin-top:0"><button class="btn btn-d" type="button" disabled>'+I('undo')+'Restore</button><button class="btn btn-s" type="button" id="rsCancel">Cancel</button></div></div></li></ol>','Everything the Hub keeps, in one zip.');
  var P5=panel('network','<form data-g="network" novalidate>'+fieldHTML({id:'pub',label:'Web public address',ph:'https://mcp.example.com/filament',mono:true,attrs:' inputmode="url"'})+fieldHTML({id:'station',label:'Weigh Station address',ph:'http://station.local:5003',mono:true,attrs:' inputmode="url"'})+'<div class="field"><span class="lbl" id="apc-l">Allow printer changes from the public address</span><span class="hint" id="apc-h">Off keeps printer changes to your own network.</span><span class="swr"><button class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="apc-l" aria-describedby="apc-h" data-sw="apc"></button><span class="swv">Off</span></span></div>'+sfoot()+'</form><h3 class="h3">Remote access</h3><div class="acts"><button class="btn btn-s" type="button" data-nh="Showing the firewall rules">'+I('shield')+'Show the firewall rules</button><button class="btn btn-s" type="button" data-nh="Getting the certificate">'+I('cert')+'Get the certificate</button></div>','How the Hub is reached from outside and from the Weigh Station.');
  var P6=panel('pass','<div class="keyrow" style="margin-bottom:var(--s5)"><div><span class="lbl">Web passphrase</span><span id="pass-b">'+badge('neutral','s-hollow','Not set',1)+'</span></div></div><form id="passF" novalidate>'+fieldHTML({id:'p1',label:'New passphrase',type:'password',hint:'At least 12 characters.',attrs:' autocomplete="new-password"'})+fieldHTML({id:'p2',label:'New passphrase again',type:'password',attrs:' autocomplete="new-password"'})+'<div class="sfoot"><button class="btn btn-p">'+I('lock')+'Set passphrase</button><span class="sstat" id="pass-r" aria-live="polite"></span></div></form>','Asks for a passphrase before this page opens from the public address.');
  var P7=panel('catalog','<div class="libstat"><span class="ti">'+I('book')+'</span><div><p><b>Catalog version 2026.11.2</b> (signed release), 3 local additions.</p><p class="hint" style="margin-top:var(--s1)">Last check 2026-11-12 03:10: ok.</p></div></div><div class="acts" style="margin-top:var(--s4)"><button class="btn btn-p" type="button" id="libUp">'+I('update')+'Update now</button><button class="btn btn-s" type="button" id="libBack">'+I('undo')+'Go back to the version before</button></div><div class="res" id="lib-r" aria-live="polite"></div>'+
    '<h3 class="h3">Catalog token</h3><form id="tokF" novalidate><p style="margin-bottom:var(--s3)">'+badge('neutral','s-hollow','Not set',1)+' <span class="hint">Optional.</span></p>'+fieldHTML({id:'tok',label:'Catalog token',type:'password',attrs:' autocomplete="off"'})+'<div class="sfoot" style="border:0;padding-top:0"><button class="btn btn-s">'+I('key')+'Set token</button><span class="sstat" id="tok-r" aria-live="polite"></span></div></form>'+
    '<h3 class="h3">Add your own entry</h3><form id="entF" novalidate>'+fieldHTML({id:'ent',label:'Entry (JSON)',type:'textarea',mono:true,ph:'{ "brand": "…", "name": "…", "material": "PLA" }'})+'<div class="sfoot" style="border:0;padding-top:0"><button class="btn btn-s">'+I('plus')+'Add entry</button><span class="sstat" id="ent-r" aria-live="polite"></span></div></form>','The filament data the Hub uses to fill in new spools.');
  var P8=panel('voice','<form data-g="voice" novalidate>'+fieldHTML({id:'voice',type:'radio',label:'Voice of the Weigh Station',value:'piper',options:[['piper','Piper','Natural; a 60-80 MB download'],['espeak','espeak-ng','Robotic; no download']]})+sfoot()+'</form>','The Weigh Station feature is on. This is how the Weigh Station speaks.');
  $('#v-settings').innerHTML='<div class="ph"><div><h1 tabindex="-1">Settings</h1><p>One group at a time. Each group saves on its own; appearance and theme apply right away.</p></div></div><div class="set" id="set">'+nav+'<div>'+P1+P2+P3+P4+P5+P6+P7+P8+'</div></div>';
  $$('form[data-g]').forEach(function(f){f._snap=JSON.stringify(snap(f))});
  showGroup(S.sg,false);syncTheme();
}
function snap(f){var v=formVals(f);$$('[data-sw]',f).forEach(function(s){v[s.dataset.sw]=s.getAttribute('aria-checked')});return v}
function showGroup(k,focus){
  S.sg=k;
  $$('.spanel').forEach(function(p){p.hidden=p.id!=='sp-'+k});
  $$('[data-sg]').forEach(function(b){b.setAttribute('aria-current',String(b.dataset.sg===k))});
  if(focus)$('#sh-'+k).focus();
}
var isPhone=function(){return matchMedia('(max-width:600px)').matches};
var V6=$('#v-settings');
V6.addEventListener('click',function(e){
  var b;
  if((b=e.target.closest('[data-sg]'))){S.sOpen=true;$('#set').classList.add('open');showGroup(b.dataset.sg,true);if(isPhone())window.scrollTo(0,0);return}
  if(e.target.closest('[data-sback]')){S.sOpen=false;$('#set').classList.remove('open');$('[data-sg="'+S.sg+'"]').focus();return}
  if((b=e.target.closest('[data-sw]'))){var on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));b.nextElementSibling.textContent=on?'On':'Off';dirty(b.closest('form'));return}
  if((b=e.target.closest('[data-look]'))){if(b.getAttribute('aria-pressed')!=='true')location.href=b.dataset.look+(location.hash||'#settings');return}
  if((b=e.target.closest('[data-nh]')))return notHere(b.dataset.nh);
  if((b=e.target.closest('[data-dl]')))return notHere('Downloading a backup');
  if((b=e.target.closest('#bkNow'))){
    var out=$('#bk-r');
    needCode(function(){if(runJob('Backup',['Collecting the inventory database…','Adding the label photos (14.2 MB)…','Adding the setup secrets…','Writing the zip…'],'Backup: done.',4000,function(){stat(out,'ok','check','Backup: done.')}))stat(out,'mut','info','Running. You can follow it from any page.')});
    return;
  }
  if((b=e.target.closest('#libUp'))){needCode(function(){if(runJob('Filament Catalog update',['Checking for a new release…','Checking the signature…','Merging with 3 local additions…'],'Filament Catalog update: done. Already the newest version.',3000))res($('#lib-r'),'neutral','info','Updating. You can follow it from any page.')});return}
  if((b=e.target.closest('#libBack'))){confirmDlg('Go back to the version before?','The Filament Catalog goes back to the release before 2026.11.2. Your 3 local additions stay.','Go back',function(){needCode(function(){res($('#lib-r'),'ok','check','Went back to the version before. Update now returns to 2026.11.2.')})});return}
  if((b=e.target.closest('#rsCancel'))){$('#rsFile').value='';$('#rsName').textContent='No file chosen';$('#rsUp').disabled=true;return}
  if((b=e.target.closest('#rsUp')))return notHere('Checking a backup zip');
  if((b=e.target.closest('[data-k]'))){
    var k=b.dataset.k, r=$('#aikey-r');
    if(k==='replace'){var f=$('#aikey-new');f.hidden=!f.hidden;b.setAttribute('aria-expanded',String(!f.hidden));if(!f.hidden)$('#f-aik').focus();return}
    if(k==='check'){b.disabled=true;res(r,'neutral','spin','Checking the key…');later(function(){b.disabled=false;res(r,'ok','check','The key works.')},1200);return}
    if(k==='remove')confirmDlg('Remove the API key?','The Label Reader stops until a new key is set.','Remove key',function(){needCode(function(){$('#aikey-b').innerHTML=badge('neutral','s-hollow','Not set',1);res($('#aikey-r'),'ok','check','API key removed.')})});
  }
});
V6.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='thm-set'){setTheme(t.value,true);stat($('#thm-r'),'ok','check','Appearance: '+t.value.charAt(0).toUpperCase()+t.value.slice(1)+'. Saved in this browser.');return}
  if(t.id==='rsFile'){$('#rsName').textContent=t.files&&t.files[0]?t.files[0].name:'No file chosen';$('#rsUp').disabled=!(t.files&&t.files[0])}
});
function dirty(f){if(!f||!f._snap)return;var s=$('.sstat',f);if(JSON.stringify(snap(f))!==f._snap)stat(s,'warn','pencil','Not saved yet');else s.innerHTML=''}
V6.addEventListener('input',function(e){dirty(e.target.closest('form[data-g]'))});
V6.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();
  if(f.dataset.g){
    var s=$('.sstat',f), now=snap(f), old=JSON.parse(f._snap);
    if(JSON.stringify(now)===f._snap){stat(s,'mut','info','Nothing changed.');return}
    if(f.dataset.g==='general'&&!now.dname){fieldErr($('#f-dname'),'Enter a display name.');$('#f-dname').focus();return}
    fieldErr($('#f-dname'),'');
    needCode(function(){
      f._snap=JSON.stringify(now);
      var restart=f.dataset.g==='ai'&&(now.model!==old.model||now.reads!==old.reads);
      stat(s,'ok','check',restart?'Saved. The Hub restarts now.':'Saved');
      if(f.dataset.g==='general')$('#srvname').textContent=now.dname+' · 0.5.2';
      if(f.dataset.g==='storage'){$('#sum-storage').textContent=now.locs}
    });
    return;
  }
  if(f.id==='passF'){
    var a=$('#f-p1'),b=$('#f-p2');fieldErr(a,'');fieldErr(b,'');
    if(a.value.length<12){fieldErr(a,'Use at least 12 characters.');a.focus();return}
    if(a.value!==b.value){fieldErr(b,'The two passphrases do not match.');b.focus();return}
    needCode(function(){a.value='';b.value='';$('#pass-b').innerHTML=badge('ok','s-filled','Set',1);$('#sum-pass').textContent='Set';stat($('#pass-r'),'ok','check','Passphrase set.')});
    return;
  }
  if(f.id==='aikey-new'){var k=$('#f-aik');fieldErr(k,'');if(!k.value){fieldErr(k,'Paste the new key, or close with Replace.');k.focus();return}needCode(function(){k.value='';f.hidden=true;$('[data-k="replace"]').setAttribute('aria-expanded','false');$('#aikey-b').innerHTML=badge('ok','s-filled','Set',1);res($('#aikey-r'),'ok','check','New API key saved.')});return}
  if(f.id==='tokF'){var t=$('#f-tok');fieldErr(t,'');if(!t.value){fieldErr(t,'Paste the token first.');t.focus();return}needCode(function(){t.value='';stat($('#tok-r'),'ok','check','Token set.')});return}
  if(f.id==='entF'){var x=$('#f-ent');fieldErr(x,'');try{var j=JSON.parse(x.value);if(!j||typeof j!=='object'||Array.isArray(j))throw 0}catch(err){fieldErr(x,'This is not a JSON object. Check the braces and quotes.');x.focus();return}needCode(function(){x.value='';stat($('#ent-r'),'ok','check','Entry added. Now 4 local additions.')});return}
});

/* =================== PLACEHOLDER VIEWS =================== */
function place(v,title,intro,rows){
  $('#v-'+v).innerHTML='<div class="ph"><div><h1 tabindex="-1">'+title+'</h1><p>'+intro+'</p></div></div><div class="card place">'+badge('neutral','s-diamond','Not part of this mockup')+'<ul class="prows">'+rows.map(function(r){return '<li><span class="pi">'+I(r[0])+'</span><span><b>'+r[1]+'</b><small>'+r[2]+'</small>'+(r[3]||'')+'</span></li>'}).join('')+'</ul></div>';
}
function placeholders(){
  place('overview','Overview','Everything at a glance.',[['printer','3 printers','2 connected, 1 offline'],['spool','Loaded now','5 spools in Workshop X1 and Garage Voron','<span class="swrow">'+['#2B2B2E','#F2762E','#F4F4F2','#8D9199','#2E6FD9'].map(function(c){return '<span class="sw" style="background:'+c+'"></span>'}).join('')+'</span>'],['archive','Last backup','2026-11-12 03:00 · nightly']]);
  place('features','Features','Parts of Spoolwarden you can switch on or off. Changes run as a job.',[['phone','Weigh Station','On'],['spark','Label Reader','On']]);
  place('devices','Devices','The Weigh Station and phones that use this Hub.',[['phone','Weigh Station','Last addition 2026-11-11 19:22']]);
  place('presets','Slicer presets','Filament presets for Bambu Studio and Orca Slicer, made from the spools in stock.',[['layers','Filament presets','Made again when spools change']]);
  place('flash','Flash a device','Put Spoolwarden on a small device plugged into this computer or the Hub.',[['tag','Tag Reader','Plugged into this computer or the Hub'],['monitor','Weigh Station display','Plugged into this computer or the Hub']]);
  place('updates','Updates','Spoolwarden and its Filament Catalog.',[['update','Spoolwarden 0.5.2','Installed'],['book','Filament Catalog 2026.11.2','Signed release']]);
  place('logs','Logs','Hub messages and job logs.',[['logs','Job logs','Each job keeps its log lines'],['archive','Backup','2026-11-12 03:00 · nightly']]);
}

/* =================== ROUTER =================== */
function parse(){
  var h=decodeURIComponent(location.hash.slice(1)), th=null, m=h.match(/^(.+)-(light|dark)$/);
  if(m){h=m[1];th=m[2]}
  if(ALIAS[h])h=ALIAS[h];
  if(VIEWS.indexOf(h)<0)h='printers';
  return {v:h,th:th};
}
function route(first){
  var r=parse();
  if(r.th)setTheme(r.th,false);
  while(stack.length)closeLayer(topLayer(),true);
  if(openMenu)setMenu(openMenu.btn,openMenu.menu,false);
  S.view=r.v;
  if(r.v==='recent-detail')renderDetail();
  if(r.v==='recent')renderIntake();
  if(r.v==='settings'&&!S.sOpen)$('#set').classList.remove('open');
  $$('.view').forEach(function(s){s.hidden=s.id!=='v-'+r.v});
  markNav();
  var n=NAV.filter(function(x){return x[0]===navKey(r.v)})[0];
  document.title=(r.v==='recent-detail'?'Recently added record':n[1])+' · Spoolwarden';
  if(!first){window.scrollTo(0,0);var h=$('#v-'+r.v+' h1');if(h)h.focus({preventScroll:true})}
}
window.addEventListener('hashchange',function(){route(false)});

/* =================== CHROME EVENTS + INIT =================== */
buildNav();buildTheme();drawLock();
renderPrinters();renderIntake();renderSettings();placeholders();
setTheme(themePref,false);
$('#moreBtn').addEventListener('click',function(e){setMenu(this,$('#moreMenu'),$('#moreMenu').hidden)});
$('#moreMenu').addEventListener('click',function(e){if(e.target.closest('a'))setMenu($('#moreBtn'),$('#moreMenu'),false)});
$('#thmBtn').addEventListener('click',function(){setMenu(this,$('#thmMenu'),$('#thmMenu').hidden)});
$('#thmMenu').addEventListener('click',function(e){var b=e.target.closest('[data-thm]');if(!b)return;setTheme(b.dataset.thm,true);setMenu($('#thmBtn'),$('#thmMenu'),false);$('#thmBtn').focus();say('Appearance: '+b.textContent)});
$('#seg').addEventListener('change',function(e){setTheme(e.target.value,true)});
$('#bbMore').addEventListener('click',phoneMore);
$('#lock').addEventListener('click',function(){if(S.lock==='locked')openUnlock();else lockMenu()});
document.addEventListener('click',function(e){if(openMenu&&!openMenu.menu.contains(e.target)&&!openMenu.btn.contains(e.target))setMenu(openMenu.btn,openMenu.menu,false)});
document.addEventListener('keydown',function(e){
  if(!openMenu||(e.key!=='ArrowDown'&&e.key!=='ArrowUp'))return;
  var it=$$('a,button',openMenu.menu), i=it.indexOf(document.activeElement);
  e.preventDefault();it[(i+(e.key==='ArrowDown'?1:-1)+it.length)%it.length].focus();
});
route(true);
})();
</script>
