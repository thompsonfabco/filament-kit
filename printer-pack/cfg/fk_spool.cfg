# filament-kit printer pack: spool macros. Written by fk-printer-pack.sh; `fk-printer-pack.sh uninstall` removes it.
# Do not edit here (an update rewrites this file); put your own changes in your own config.
#
# Per-tool spools for multi-tool printers (toolchangers, IDEX):
#   FK_SET_TOOL_SPOOL TOOL=<n> ID=<spool id>   remember which spool is in tool n (ID=0 clears); filament-kit's
#                                              bridge sends this when you load a tool from the app or reader
#   _FK_TOOL_CHANGED T=<n>                     call this from your tool-change macro (T0, T1 ... or
#                                              ACTIVATE_EXTRUDER) after the change: it points Moonraker's active
#                                              spool at tool n's spool, so filament usage goes to the right spool
# Tag scan feedback (nfc2klipper calls these): _FK_SCAN_OK ID=<spool>, _FK_SCAN_UNKNOWN
# The tool spools survive a restart when [save_variables] is set up (variables fk_t0, fk_t1 ...).

[gcode_macro _FK_TOOL_SPOOLS]
description: filament-kit: the spool in each tool (0 = none)
variable_t0: 0
variable_t1: 0
variable_t2: 0
variable_t3: 0
variable_t4: 0
variable_t5: 0
variable_t6: 0
variable_t7: 0
variable_t8: 0
variable_t9: 0
variable_t10: 0
variable_t11: 0
variable_t12: 0
variable_t13: 0
variable_t14: 0
variable_t15: 0
gcode:
  {% for n in range(16) %}
    {% set id = printer["gcode_macro _FK_TOOL_SPOOLS"]["t" ~ n] %}
    {% if id|int > 0 %}
      RESPOND MSG="Tool {n}: spool {id}"
    {% endif %}
  {% endfor %}


[delayed_gcode _FK_TOOL_SPOOLS_RESTORE]
initial_duration: 1
gcode:
  {% if "save_variables" in printer %}
    {% set sv = printer.save_variables.variables %}
    {% for n in range(16) %}
      {% if ("fk_t" ~ n) in sv %}
        SET_GCODE_VARIABLE MACRO=_FK_TOOL_SPOOLS VARIABLE=t{n} VALUE={sv["fk_t" ~ n]|int}
      {% endif %}
    {% endfor %}
  {% endif %}


[gcode_macro FK_SET_TOOL_SPOOL]
description: filament-kit: TOOL=<n> ID=<spool id> (ID=0 clears) - which spool is in a tool
gcode:
  {% set tool = params.TOOL|default(-1)|int %}
  {% set id = params.ID|default(0)|int %}
  {% if tool < 0 or tool > 15 %}
    {action_raise_error("FK_SET_TOOL_SPOOL: TOOL must be 0 to 15")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_FK_TOOL_SPOOLS VARIABLE=t{tool} VALUE={id}
  {% if "save_variables" in printer %}
    SAVE_VARIABLE VARIABLE=fk_t{tool} VALUE={id}
  {% endif %}
  {% set ext = printer.toolhead.extruder %}
  {% set active = 0 if ext == "extruder" else (ext[8:]|int if ext[8:] else -1) %}
  {% if active == tool %}
    _FK_TOOL_CHANGED T={tool}
  {% endif %}


[gcode_macro _FK_TOOL_CHANGED]
description: filament-kit: T=<n> - call after a tool change; Moonraker's active spool becomes tool n's spool
gcode:
  {% set t = params.T|default(-1)|int %}
  {% if t >= 0 and t <= 15 %}
    {% set id = printer["gcode_macro _FK_TOOL_SPOOLS"]["t" ~ t]|int %}
    {% if id > 0 %}
      SET_ACTIVE_SPOOL ID={id}
    {% else %}
      CLEAR_ACTIVE_SPOOL
    {% endif %}
  {% endif %}


[gcode_macro _FK_SCAN_OK]
description: filament-kit: a tag matched spool ID (nfc2klipper calls this)
gcode:
  @SCAN_OK@


[gcode_macro _FK_SCAN_UNKNOWN]
description: filament-kit: a tag was read that matches no spool (nfc2klipper calls this)
gcode:
  @SCAN_UNKNOWN@


[gcode_macro _FK_ON_SPOOL_SET]
description: filament-kit: runs when SET_ACTIVE_SPOOL picks a spool (the load-temperature part hooks in here)
gcode:
  {% if "gcode_macro _FK_LOAD_LOOKUP" in printer %}
    _FK_LOAD_LOOKUP ID={params.ID|default(0)|int}
  {% endif %}
