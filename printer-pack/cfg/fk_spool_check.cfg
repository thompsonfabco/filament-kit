# filament-kit printer pack: spool check at print start (needs gcode_shell_command). Written by fk-printer-pack.sh.
#   FK_SPOOL_CHECK MODE=off|warn|cancel     the setting (kept in save_variables when available; default warn)
#   _FK_SPOOL_CHECK FILAMENT=<type> VENDOR=<vendor>   call it from your print start macro, e.g. with OrcaSlicer:
#       _FK_SPOOL_CHECK FILAMENT="[filament_type]" VENDOR="[filament_vendor]"
# warn: a console warning when the sliced filament differs from the active spool; cancel: also cancels the print.
# The values reach the script with every character outside A-Z a-z 0-9 - turned into "_" (a quote, $ or ; in a vendor
# name can never break the shell command's parsing). Note Klipper itself drops what follows a ";" or "#" on the
# calling line, so a slicer value with one of those is cut there before this macro sees it.

[gcode_shell_command fk_spool_check]
command: python3 @PACK@/scripts/fk_spool_check.py
timeout: 10.
verbose: True


[gcode_macro FK_SPOOL_CHECK]
description: filament-kit: MODE=off|warn|cancel - check the active spool against the sliced filament at print start
variable_mode: "warn"
gcode:
  {% set m = params.MODE|default("")|lower %}
  {% if m in ["off", "warn", "cancel"] %}
    SET_GCODE_VARIABLE MACRO=FK_SPOOL_CHECK VARIABLE=mode VALUE='"{m}"'
    {% if "save_variables" in printer %}
      SAVE_VARIABLE VARIABLE=fk_spool_check VALUE='"{m}"'
    {% endif %}
  {% endif %}
  RESPOND MSG="Spool check: {printer['gcode_macro FK_SPOOL_CHECK'].mode if not m else m}"


[delayed_gcode _FK_SPOOL_CHECK_RESTORE]
initial_duration: 1
gcode:
  {% if "save_variables" in printer and "fk_spool_check" in printer.save_variables.variables %}
    SET_GCODE_VARIABLE MACRO=FK_SPOOL_CHECK VARIABLE=mode VALUE='"{printer.save_variables.variables.fk_spool_check}"'
  {% endif %}


[gcode_macro _FK_SPOOL_CHECK]
gcode:
  {% set mode = printer["gcode_macro FK_SPOOL_CHECK"].mode %}
  {% if mode in ["warn", "cancel"] %}
    {% set ok = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-" %}
    {% set ns = namespace(f="", v="") %}
    {% for c in (params.FILAMENT|default("")|string)[:64] %}{% set ns.f = ns.f ~ (c if c in ok else "_") %}{% endfor %}
    {% for c in (params.VENDOR|default("")|string)[:64] %}{% set ns.v = ns.v ~ (c if c in ok else "_") %}{% endfor %}
    RUN_SHELL_COMMAND CMD=fk_spool_check PARAMS="{mode} {ns.f or '_'} {ns.v or '_'}"
  {% endif %}


[gcode_macro _FK_SPOOL_MISMATCH]
description: filament-kit: posted by fk_spool_check.py in cancel mode (the cancel itself goes through Moonraker)
gcode:
  RESPOND TYPE=error MSG="{params.MSG|default('Spool mismatch')}"
