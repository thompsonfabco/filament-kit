# filament-kit printer pack: Moonraker's active spool. Installed only on printers that have no SET_ACTIVE_SPOOL /
# CLEAR_ACTIVE_SPOOL macros of their own (two sections with one name would merge). Written by fk-printer-pack.sh.

[gcode_macro SET_ACTIVE_SPOOL]
description: Set the Spoolman spool that filament usage is charged to (filament-kit)
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
    RESPOND MSG="Active spool: {id}"
    _FK_ON_SPOOL_SET ID={id}
  {% else %}
    {action_respond_info("SET_ACTIVE_SPOOL: parameter ID is required")}
  {% endif %}


[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Stop charging filament usage to any Spoolman spool (filament-kit)
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  RESPOND MSG="Active spool cleared"
