# filament-kit printer pack: the load temperature of the active spool (needs gcode_shell_command).
# When a spool is set active, fk_load_temp.py reads its filament from Spoolman in the background and posts
# _FK_SPOOL_TEMP ID= TEMP= back: the filament's nozzle_range (filament-kit) or extruder temperature, else a
# material default. Your load macro can use it:  {printer["gcode_macro _FK_LOAD_LOOKUP"].temp}  (0 = unknown).
# Written by fk-printer-pack.sh.

[gcode_shell_command fk_load_temp]
command: sh @PACK@/scripts/fk_load_temp.sh
timeout: 5.
verbose: False


[gcode_macro _FK_LOAD_LOOKUP]
description: filament-kit: look up the spool's load temperature in the background
variable_pending: 0
variable_id: 0
variable_temp: 0
gcode:
  {% set id = params.ID|default(0)|int %}
  {% set me = printer["gcode_macro _FK_LOAD_LOOKUP"] %}
  {% if id > 0 and id != me.id and id != me.pending %}
    SET_GCODE_VARIABLE MACRO=_FK_LOAD_LOOKUP VARIABLE=temp VALUE=0
    SET_GCODE_VARIABLE MACRO=_FK_LOAD_LOOKUP VARIABLE=pending VALUE={id}
    RUN_SHELL_COMMAND CMD=fk_load_temp PARAMS="{id}"
  {% endif %}


[gcode_macro _FK_SPOOL_TEMP]
description: filament-kit: posted by fk_load_temp.py
gcode:
  {% set id = params.ID|default(0)|int %}
  {% set t = params.TEMP|default(0)|int %}
  {% if id == printer["gcode_macro _FK_LOAD_LOOKUP"].pending %}
    SET_GCODE_VARIABLE MACRO=_FK_LOAD_LOOKUP VARIABLE=pending VALUE=0
    SET_GCODE_VARIABLE MACRO=_FK_LOAD_LOOKUP VARIABLE=id VALUE={id}
    SET_GCODE_VARIABLE MACRO=_FK_LOAD_LOOKUP VARIABLE=temp VALUE={t}
    RESPOND MSG="Spool {id}: loads at {t if t > 0 else 'an unknown'}°C"
  {% endif %}
