; Intake station button panel: Wemos D1 mini (ESP-12F / ESP8266) on the station PC's USB.
; Passive buzzer + two illuminated NO buttons (Hold, Discard). A thin I/O board: the station service (filament_kit.station)
; owns all the logic and talks to it over USB serial (protocol in src/main.cpp). Build/flash: see ../PANEL.md.

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 160000000L  ; speaker PWM: half the interrupt overhead, twice the edge resolution
lib_deps = olikraus/U8g2@2.36.5  ; SSD1306 OLED

; Host tests for the pure logic in lib/panel_core (no Arduino, no hardware).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
