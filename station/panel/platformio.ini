; Intake station button panel: ESP32-C3 Super Mini on the station PC's USB (native USB serial).
; Passive buzzer + two illuminated NO buttons (Hold, Discard) + OLED + air sensor + MAX98357 I2S amplifier for speech.
; A thin I/O board: the station service (filament_kit.station) owns all the logic and talks to it over USB serial
; (protocol in src/main.cpp). Build/flash: see ../PANEL.md.

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
; pioarduino (Arduino core 3.x: ESP_I2S, ledcAttach), pinned and the same as reader/platformio.ini, so CI builds what
; the owner builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1    ; generic ESP32-C3 (4MB): matches the Super Mini
framework = arduino
; Keeps the build host's paths (from __FILE__ in the core and headers) out of the committed image.
extra_scripts = pre:prefix_map.py
monitor_speed = 115200
; The default partition table: the panel is flashed over USB by the station, no OTA.
; Serial over the Super Mini's native USB-C (USB-Serial-JTAG, no UART bridge).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Mute core log_e, as the reader does: a probe of an absent OLED or air sensor (every 30 s) would otherwise put
    ; "i2c... Error" lines on the serial link the station reads.
    -D CORE_DEBUG_LEVEL=0
lib_deps = olikraus/U8g2@2.36.5  ; SSD1306 OLED

; Host tests for the pure logic in lib/panel_core (no Arduino, no hardware).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
