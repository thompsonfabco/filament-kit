; filament-kit reader — ESP32-C3 tag reader for any Bambu printer and any slot layout
; PN532 (I2C) + SSD1306 OLED (I2C, shared bus) + rotary encoder (CLK/DT/SW) + buzzer.
; Thin client: reads a tag UID, lets you pick a printer + slot from the lists the
; filament-kit server serves (READER_BASE in src/secrets.h), POSTs the scan and
; buzzes/shows/speaks the result. See README.md.
;
;   pio run -e esp32-c3-supermini     build the firmware (needs src/secrets.h)
;   pio test -e native                host unit tests for lib/reader_core

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1    ; generic ESP32-C3 (4MB) — matches the Super Mini
framework = arduino
monitor_speed = 115200
; Two 1.9 MB OTA app slots (ota_0/ota_1) + otadata; rollback is enabled in the
; core's bootloader. Changing partitions needs one USB flash; OTA after that.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:fw_build.py
; Serial over the Super Mini's native USB-C (USB-Serial-JTAG, no UART bridge).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Mute core log_e. The PN532 NACKs I2C reads while it's searching for a tag
    ; (the library treats that as "not ready" and retries), which otherwise floods
    ; serial with "i2cRead returned Error -1". Our own Serial.print diagnostics
    ; still show. Set to 1 to see core errors again.
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.0
    pschatzmann/TalkiePCM@^0.1.1     ; LPC speech -> PCM (GPL-3.0); we PWM it out the buzzer

; Host tests for the pure logic in lib/reader_core (no Arduino, no hardware).
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
