# systemd drop-in for nginx.service (save as /etc/systemd/system/nginx.service.d/filament-kit.conf):
# nginx's network limits: localhost, Anthropic's ranges, and your LAN. Printed by the kit, never installed by it.
[Service]
IPAddressDeny=any
IPAddressAllow=127.0.0.0/8 ::1 160.79.104.0/21 2607:6bc0::/48 @LAN@
