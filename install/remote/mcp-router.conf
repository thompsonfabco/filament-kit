# filament-kit router: one hostname, one certificate, one path prefix per route (routes in /etc/nginx/mcp.d/*.conf,
# written by mcp-route). Installed as /etc/nginx/conf.d/filament-kit-router.conf with @HOST@ filled in.
# Who may reach port 443 is up to your firewall; the kit never changes it (see `filament-kit remote firewall`).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/mcp-router/tls/fullchain.pem;
    ssl_certificate_key /etc/mcp-router/tls/privkey.pem;
    return 444;  # wrong Host: close without answering
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @HOST@;

    ssl_certificate     /etc/mcp-router/tls/fullchain.pem;
    ssl_certificate_key /etc/mcp-router/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mcp:5m;
    server_tokens off;
    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/mcp-router.access.log;
    error_log  /var/log/nginx/mcp-router.error.log warn;

    include /etc/nginx/mcp.d/*.conf;

    location = /health { default_type text/plain; return 200 "router ok\n"; }
    location / { return 404; }
}
