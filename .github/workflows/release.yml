name: release
# A tag v<x.y.z> builds and publishes one release: the server tarball (with the signed APK inside),
# the signed APK on its own, the PC sync installer (Windows) and tarball (Linux), get.sh, bambu_hardware.xml (the updater's hardware
# data feed) and SHA256SUMS of all of them with its signature SHA256SUMS.sig. The tag must equal
# __version__ of both the server and pc-sync. The APK is
# signed from the repository secrets FK_KEYSTORE_B64 (the keystore, base64) and FK_KEYSTORE_PASSWORD;
# SHA256SUMS is signed (ed25519) with the secret FK_RELEASE_KEY, the private key the owner made with
# tools/sign_release.py keygen, whose public half is in release.py and get.sh. Without these secrets
# the release fails (never an unsigned APK or SHA256SUMS).
# library.tar.gz (the filament library, spec R 2.6) is built from the public thompsonfabco/filament-library repo
# and signed in SHA256SUMS like the rest; the secret FK_LIBRARY_TOKEN (a read-only token) is used when set.
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: Check the tag against __version__
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          server=$(sed -n 's/^__version__ = "\(.*\)"\r\{0,1\}$/\1/p' server/filament_kit/__init__.py)
          sync=$(sed -n 's/^__version__ = "\(.*\)"\r\{0,1\}$/\1/p' pc-sync/fksync/__init__.py)
          if [ "$version" != "$server" ] || [ "$version" != "$sync" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ (server $server, pc-sync $sync)"
            exit 1
          fi
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH, so MINOR and PATCH stay below 100.
          # Pre-release tags (v0.3.0-rc1) are rejected on purpose: the formula has no room for them,
          # and an rc's versionCode would equal the final release's, so phones would not update to it.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error::version $version is not MAJOR.MINOR.PATCH with MINOR and PATCH below 100"
            exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if [ "$code" -le 0 ]; then
            echo "::error::versionCode $code must be above 0"
            exit 1
          fi
          # the release's notes are written before the tag: release-notes/v<version>.md
          if [ ! -s "release-notes/v$version.md" ]; then
            echo "::error::release-notes/v$version.md is missing or empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "version $version, versionCode $code"

  server:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the wheel builder
        # exact versions and hashes: this job holds the Android keystore secrets
        run: |
          pip install --require-hashes --only-binary :all: -r tools/release-build-requirements.txt

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          # as android.yml: AGP downloads the platform and build-tools it needs itself
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Keystore
        env:
          FK_KEYSTORE_B64: ${{ secrets.FK_KEYSTORE_B64 }}
          FK_KEYSTORE_PASSWORD: ${{ secrets.FK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FK_KEYSTORE_B64" ] || [ -z "$FK_KEYSTORE_PASSWORD" ]; then
            echo "::error::the secrets FK_KEYSTORE_B64 and FK_KEYSTORE_PASSWORD are required; no unsigned release is built"
            exit 1
          fi
          ks="$RUNNER_TEMP/filament-kit-release.jks"
          (umask 077 && printf '%s' "$FK_KEYSTORE_B64" | base64 -d > "$ks")
          if [ ! -s "$ks" ]; then
            echo "::error::FK_KEYSTORE_B64 did not decode to a keystore"
            exit 1
          fi
          echo "FK_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          repository: thompsonfabco/filament-library
          # the data this signed release carries, by commit: raising it is a choice made for a release, not whatever is
          # on that repository's main at tag time
          ref: 219fb461b1191a238c4849dd5719d64b38690c22
          token: ${{ secrets.FK_LIBRARY_TOKEN || github.token }}
          path: filament-library
          persist-credentials: false

      - name: Build the tarball and the signed APK
        env:
          FK_KEYSTORE_PASSWORD: ${{ secrets.FK_KEYSTORE_PASSWORD }}
          FK_VERSION_CODE: ${{ needs.version.outputs.code }}
          # make_release.sh builds dist/library.tar.gz from this checkout when it is there, and skips it when not
          FK_LIBRARY_SRC: ${{ github.workspace }}/filament-library
        run: |
          bash tools/make_release.sh
          tarball="dist/filament-kit-$VERSION.tar.gz"
          # Gradle names an unsigned release build app-release-unsigned.apk: this file is the signed one.
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$tarball" || { echo "::error::$tarball was not built"; exit 1; }
          test -f "$apk" || { echo "::error::no signed APK at $apk"; exit 1; }
          tar -xzOf "$tarball" "filament-kit-$VERSION/app/filament-kit.apk" > "$RUNNER_TEMP/staged.apk"
          cmp "$apk" "$RUNNER_TEMP/staged.apk" || { echo "::error::the tarball's app/filament-kit.apk is not this build"; exit 1; }
          cp "$apk" dist/filament-kit.apk

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/filament-kit-release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: server
          path: |
            dist/filament-kit-${{ needs.version.outputs.version }}.tar.gz
            dist/filament-kit.apk
            dist/bambu_hardware.xml
            dist/klipper_hardware.xml
            dist/fk-printer-pack.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: library
          path: dist/library.tar.gz
          if-no-files-found: error

  sync:
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install "./pc-sync[test]"
          pytest -n auto -rfEs pc-sync/tests

      - name: PyInstaller
        run: |
          pip install pyinstaller==6.11.1
          pyinstaller --noconfirm pc-sync/fksync.spec
          $out = ./dist/filament-kit-sync/filament-kit-sync.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne "filament-kit-sync $env:VERSION") {
            Write-Output "::error::the built exe reports '$out', expected filament-kit-sync $env:VERSION"
            exit 1
          }

      - name: Inno Setup
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Output "::error::ISCC.exe not found after installing Inno Setup"
            exit 1
          }
          & $iscc "/DAppVersion=$env:VERSION" pc-sync/installer/filament-kit-sync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "dist/filament-kit-sync-setup-$env:VERSION.exe")) {
            Write-Output "::error::dist/filament-kit-sync-setup-$env:VERSION.exe was not built"
            exit 1
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sync
          path: dist/filament-kit-sync-setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  sync-linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install "./pc-sync[test]"
          pytest -n auto -rfEs pc-sync/tests

      - name: PyInstaller and the Linux tarball
        run: |
          pip install pyinstaller==6.11.1
          bash pc-sync/linux/build.sh
          if [ ! -f "dist/filament-kit-sync-linux-x86_64-$VERSION.tar.gz" ]; then
            echo "::error::dist/filament-kit-sync-linux-x86_64-$VERSION.tar.gz was not built"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sync-linux
          path: dist/filament-kit-sync-linux-x86_64-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, server, sync, sync-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the signer
        # exact versions and hashes: this step runs with the release signing key in the job
        run: |
          pip install --require-hashes --only-binary :all: -r tools/release-signing-requirements.txt

      - name: Check get.sh carries release.py
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import sign_release
          from pathlib import Path
          if sign_release.embedded(Path("get.sh").read_text()) != Path("server/filament_kit/release.py").read_text():
              sys.exit("::error::get.sh does not carry server/filament_kit/release.py: run tools/sign_release.py sync-get")
          EOF

      - name: SHA256SUMS and its signature
        id: sums
        env:
          FK_RELEASE_KEY: ${{ secrets.FK_RELEASE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$FK_RELEASE_KEY" ]; then
            echo "::error::the secret FK_RELEASE_KEY is required; no unsigned release is published"
            exit 1
          fi
          cp get.sh dist/get.sh
          assets="filament-kit-$VERSION.tar.gz filament-kit.apk filament-kit-sync-setup-$VERSION.exe filament-kit-sync-linux-x86_64-$VERSION.tar.gz get.sh bambu_hardware.xml klipper_hardware.xml fk-printer-pack.tar.gz library.tar.gz"
          (cd dist && sha256sum $assets > SHA256SUMS)
          # refuses (and writes no signature) when the key does not match PUBKEY in release.py
          python tools/sign_release.py sign dist/SHA256SUMS
          cat dist/SHA256SUMS
          # the publish list is exactly what was signed, plus SHA256SUMS and its signature
          {
            echo "files<<FK_FILES_EOF"
            for a in $assets SHA256SUMS SHA256SUMS.sig; do echo "dist/$a"; done
            echo "FK_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          fail_on_unmatched_files: true
          # the written notes first; GitHub's generated list of changes is appended below them
          body_path: release-notes/v${{ needs.version.outputs.version }}.md
          generate_release_notes: true
          # from the sums step: dist/filament-kit-<version>.tar.gz, dist/filament-kit.apk,
          # dist/filament-kit-sync-setup-<version>.exe, dist/filament-kit-sync-linux-x86_64-<version>.tar.gz,
          # dist/get.sh, dist/bambu_hardware.xml, dist/klipper_hardware.xml, dist/fk-printer-pack.tar.gz,
          # dist/library.tar.gz (when built), dist/SHA256SUMS and dist/SHA256SUMS.sig
          files: ${{ steps.sums.outputs.files }}
