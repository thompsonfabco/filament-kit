name: server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # test_rollback_modules compares module lists with the oldest release a rollback can reach
      - name: Fetch the v0.3.0 tag
        run: git fetch --depth=1 origin refs/tags/v0.3.0:refs/tags/v0.3.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The one recipe, the same as a builder's run, a review and the merge gate: [test,web], every suite, -rs. Without [web] the
      # web module's tests skip themselves, and that is the module facing the internet.
      - name: Tests
        run: bash tools/testenv.sh --root --lint
