name: server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "./server[test]"

      # the pc-sync suite (and the end-to-end test with the server) needs pc-sync in place
      - name: Install pc-sync
        run: pip install "./pc-sync[test]"

      - name: Tests
        run: pytest server/tests

      - name: pc-sync tests
        run: pytest pc-sync/tests

      - name: Shellcheck
        run: shellcheck install/*.sh tools/*.sh
