name: server

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "./server[test]"

      - name: Tests
        run: pytest server/tests

      - name: Shellcheck
        run: shellcheck install/*.sh tools/*.sh
