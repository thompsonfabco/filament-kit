name: reader
on:
  push:
    branches-ignore: [nightly]     # no tests on the nightly branch: docs/maintainer.md, Nightly builds
    tags: ['**']
    paths: ['reader/**', '.github/workflows/reader.yml']
  pull_request:
    branches-ignore: [nightly]     # no tests on the nightly branch: docs/maintainer.md, Nightly builds
    paths: ['reader/**', '.github/workflows/reader.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('reader/platformio.ini') }}

      - name: Install
        run: pip install platformio==6.1.18 pytest pytest-xdist cryptography

      - name: Native unit tests (lib/reader_core)
        run: pio test -d reader -e native

      - name: OTA publish tool tests
        run: pytest -q -n auto -rfEs reader/tools

      - name: Firmware build (placeholder secrets)
        run: |
          cp reader/src/secrets.example.h reader/src/secrets.h
          pio run -d reader -e esp32-c3-supermini
          ls -l reader/.pio/build/esp32-c3-supermini/firmware.bin
