name: panel
on:
  push:
    branches-ignore: [nightly]     # no tests on the nightly branch: docs/maintainer.md, Nightly builds
    tags: ['**']
    paths: ['station/panel/**', '.github/workflows/panel.yml']
  pull_request:
    branches-ignore: [nightly]     # no tests on the nightly branch: docs/maintainer.md, Nightly builds
    paths: ['station/panel/**', '.github/workflows/panel.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('station/panel/platformio.ini') }}

      - name: Install
        run: pip install platformio==6.1.18

      - name: Native unit tests (lib/panel_core)
        run: pio test -d station/panel -e native

      - name: Firmware build (ESP32-C3)
        run: pio run -d station/panel -e esp32-c3-supermini
