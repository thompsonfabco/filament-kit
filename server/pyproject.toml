[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-kit"
version = "0.2.0"
description = "Pair phones, read filament labels with Claude, write spools to Spoolman"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.46",
    "uvicorn>=0.34",
    "python-multipart",
    "anthropic>=2.3.0",  # fallbacks= on beta.messages.create
    "cryptography>=44",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "pyftpdlib>=2.0", "pyopenssl>=24"]  # pyftpdlib + pyopenssl: the fake printer FTPS server
station = ["nfcpy==1.0.4", "pyserial>=3.5"]
web = ["mcp>=2.3"]  # only filament_kit.web imports it; the server process never does

[project.scripts]
filament-kit = "filament_kit.cli:main"

[tool.setuptools.packages.find]
include = ["filament_kit*"]
namespaces = false  # library_data/ is package data, not a namespace package

[tool.setuptools.package-data]
filament_kit = ["web/static/*", "library_data/*.json", "library_data/schema/*.json", "library_data/library/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
