[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-kit"
version = "0.5.1"
description = "Pair phones, read filament labels with Claude, write spools to Spoolman"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "starlette>=0.46",
    "uvicorn>=0.34",
    "python-multipart",
    "anthropic>=2.3.0",  # fallbacks= on beta.messages.create
    "cryptography>=44",
    "paho-mqtt>=2.0",
    "defusedxml==0.7.1",  # hardware XML: no DTD, entities or external references
    "websockets>=13",     # Klipper bridge: the Moonraker websocket (sync client)
    "zeroconf>=0.136",    # Klipper bridge: Moonraker mDNS discovery (listen only)
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist>=3.6", "httpx", "pyftpdlib>=2.0", "pyopenssl>=24"]  # pyftpdlib + pyopenssl: the fake printer FTPS server
station = ["nfcpy==1.0.4", "pyserial>=3.5", "esptool==5.6.0"]
# the panel's Piper voice (with onnxruntime): install.sh adds it only where the station module is on; espeak-ng without
station-tts = ["piper-tts==1.8.0"]
web = ["mcp==2.3.0"]  # exact: the web unit imports SDK internals and install.sh upgrades; the server process never imports it
push = ["pywebpush>=2.0,<3"]  # only for config web.push (Printers tab alerts); the sender imports it when used

[project.scripts]
filament-kit = "filament_kit.cli:main"

[tool.setuptools.packages.find]
include = ["filament_kit*"]
namespaces = false  # library_data/ is package data, not a namespace package

[tool.setuptools.package-data]
filament_kit = ["web/static/*", "setup_static/*", "library_data/*.json", "library_data/schema/*.json", "bridge/*.xml", "bridge/klipper/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
